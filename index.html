<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Heinrich Schmid – Team-Planer</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#f4f6f9; color:#1c2b3a; }
  #root { min-height:100vh; }
  .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:#fff; border-radius:14px; padding:28px; width:100%; max-width:380px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
  h1 { font-size:19px; margin:0 0 4px; color:#1c3a5e; }
  .sub { font-size:13px; color:#66768E; margin-bottom:18px; }
  label { font-size:13px; color:#44586e; display:block; margin:10px 0 4px; }
  input, select { width:100%; padding:10px 12px; border:1px solid #dbe2ea; border-radius:8px; font-size:14px; }
  button { cursor:pointer; border:none; border-radius:8px; font-weight:600; font-size:14px; }
  .btn-primary { background:#1c3a5e; color:#fff; padding:11px; width:100%; margin-top:16px; }
  .btn-secondary { background:#eef1f5; color:#1c3a5e; padding:9px 14px; }
  .btn-danger { background:#fdeaea; color:#a33; padding:7px 10px; font-size:12px; }
  .err { color:#a33; font-size:12.5px; margin-top:8px; }
  .rolebtns { display:flex; gap:8px; margin-bottom:18px; }
  .rolebtns button { flex:1; padding:9px; border-radius:8px; background:#eef1f5; color:#44586e; }
  .rolebtns button.active { background:#1c3a5e; color:#fff; }
  header.topbar { background:#1c3a5e; color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
  header.topbar .who { font-size:13px; opacity:.85; }
  main { max-width:760px; margin:0 auto; padding:18px; }
  .section { background:#fff; border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .section h2 { font-size:15px; margin:0 0 12px; color:#1c3a5e; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:120px; }
  .termin { border:1px solid #e6eaf0; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .termin .t-head { display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:14px; }
  .termin .t-meta { font-size:12.5px; color:#66768E; margin-top:4px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; }
  .badge.offen { background:#eaf1ff; color:#1c5ebf; }
  .badge.anfrage { background:#fff4e0; color:#a3720a; }
  .anfrage-box { margin-top:8px; font-size:12.5px; background:#fff8ea; border:1px solid #f0e0b3; border-radius:8px; padding:8px 10px; }
  .link-btn { background:none; color:#1c5ebf; font-size:12.5px; padding:0; text-decoration:underline; }
  .emp-chip { display:inline-flex; align-items:center; gap:6px; background:#eef1f5; border-radius:20px; padding:5px 10px 5px 12px; font-size:12.5px; margin:3px 4px 3px 0; }
  .emp-chip button { background:none; color:#a33; font-size:12px; padding:0 2px; }
  .empty { color:#8a97a6; font-size:13px; text-align:center; padding:14px; }
</style>
</head>
<body>
<div id="root"><div class="center">Wird geladen …</div></div>

<script type="module">
  /* ---- Firebase / Speicher-Backend (geräteübergreifend synchron) ---- */
  const firebaseConfig = {
    apiKey: "AIzaSyAUOLTCYtr7fQc4kP3j-t6lsgAK4BIEgw8",
    authDomain: "hs-planer-104d7.firebaseapp.com",
    projectId: "hs-planer-104d7",
    storageBucket: "hs-planer-104d7.firebasestorage.app",
    messagingSenderId: "921699904238",
    appId: "1:921699904238:web:a05c701a4b6e1c3d7fe1ff",
  };
  function localFallback() {
    window.storage = {
      async get(key, shared) { const raw = localStorage.getItem("mf_"+(shared?"s_":"p_")+key); return raw===null?null:{key,value:raw,shared:!!shared}; },
      async set(key, value, shared) { localStorage.setItem("mf_"+(shared?"s_":"p_")+key, value); return {key,value,shared:!!shared}; },
    };
  }
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
    const { getFirestore, doc, getDoc, setDoc } = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js");
    const fbApp = initializeApp(firebaseConfig);
    const fs = getFirestore(fbApp);
    window.storage = {
      async get(key, shared) {
        if (!shared) { const raw = localStorage.getItem("mf_p_"+key); return raw===null?null:{key,value:raw,shared:false}; }
        const snap = await getDoc(doc(fs, "malerfirma_shared", key));
        return snap.exists() ? {key, value:snap.data().value, shared:true} : null;
      },
      async set(key, value, shared) {
        if (!shared) { localStorage.setItem("mf_p_"+key, value); return {key,value,shared:false}; }
        await setDoc(doc(fs, "malerfirma_shared", key), {value, updatedAt: Date.now()});
        return {key,value,shared:true};
      },
    };
  } catch (e) { console.warn("Firebase nicht verfügbar, nutze lokalen Speicher:", e); localFallback(); }

  /* ---------------------------- App-Logik ---------------------------- */
  const root = document.getElementById("root");
  const uid = () => Math.random().toString(36).slice(2,9);
  const todayStr = () => new Date().toISOString().slice(0,10);

  async function loadData() {
    const r = await window.storage.get("mf_data", true);
    if (r) { try { return JSON.parse(r.value); } catch(e) {} }
    return { chefPassword: null, employees: [], termine: [], anfragen: [] };
  }
  async function saveData(d) { await window.storage.set("mf_data", JSON.stringify(d), true); }

  function getSession() {
    try { return JSON.parse(localStorage.getItem("mf_session") || "null"); } catch(e) { return null; }
  }
  function setSession(s) { s ? localStorage.setItem("mf_session", JSON.stringify(s)) : localStorage.removeItem("mf_session"); }

  let DATA = await loadData();
  let SESSION = getSession();

  function esc(s) { return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  async function render() {
    DATA = await loadData();
    if (!SESSION) return renderLogin();
    if (SESSION.role === "chef") return renderChef();
    return renderMitarbeiter();
  }

  /* ---- Login ---- */
  function renderLogin() {
    let mode = "mitarbeiter";
    root.innerHTML = `
      <div class="center"><div class="card">
        <h1>Heinrich Schmid</h1>
        <div class="sub">Arbeitsmanager – Anmeldung</div>
        <div class="rolebtns">
          <button id="mMit" class="active">Mitarbeiter</button>
          <button id="mChef">Chef</button>
        </div>
        <div id="loginFields"></div>
        <div id="loginErr" class="err"></div>
      </div></div>`;
    const fields = document.getElementById("loginFields");
    function drawFields() {
      if (mode === "mitarbeiter") {
        fields.innerHTML = `
          <label>Name</label>
          <select id="empSel">${DATA.employees.length ? DATA.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("") : `<option disabled selected>Noch keine Mitarbeiter angelegt</option>`}</select>
          <label>Passwort</label>
          <input type="password" id="empPw" />
          <button class="btn-primary" id="loginBtn">Anmelden</button>`;
      } else {
        fields.innerHTML = `
          <label>Passwort</label>
          <input type="password" id="chefPw" />
          <button class="btn-primary" id="loginBtn">${DATA.chefPassword ? "Anmelden" : "Chef-Passwort festlegen"}</button>`;
      }
      document.getElementById("loginBtn").onclick = doLogin;
    }
    document.getElementById("mMit").onclick = () => { mode="mitarbeiter"; document.getElementById("mMit").classList.add("active"); document.getElementById("mChef").classList.remove("active"); drawFields(); };
    document.getElementById("mChef").onclick = () => { mode="chef"; document.getElementById("mChef").classList.add("active"); document.getElementById("mMit").classList.remove("active"); drawFields(); };
    drawFields();

    async function doLogin() {
      const errEl = document.getElementById("loginErr");
      errEl.textContent = "";
      if (mode === "chef") {
        const pw = document.getElementById("chefPw").value;
        if (!pw) { errEl.textContent = "Bitte Passwort eingeben."; return; }
        if (!DATA.chefPassword) {
          DATA.chefPassword = pw; await saveData(DATA);
          SESSION = { role:"chef" }; setSession(SESSION); return render();
        }
        if (pw !== DATA.chefPassword) { errEl.textContent = "Falsches Passwort."; return; }
        SESSION = { role:"chef" }; setSession(SESSION); return render();
      } else {
        const sel = document.getElementById("empSel");
        const pw = document.getElementById("empPw").value;
        const emp = DATA.employees.find(e => e.id === sel.value);
        if (!emp) { errEl.textContent = "Kein Mitarbeiter ausgewählt."; return; }
        if (pw !== emp.password) { errEl.textContent = "Falsches Passwort."; return; }
        SESSION = { role:"mitarbeiter", id: emp.id }; setSession(SESSION); return render();
      }
    }
  }

  function topbar(name) {
    return `<header class="topbar"><div><strong>Heinrich Schmid</strong> <span class="who">– ${esc(name)}</span></div>
      <button class="btn-secondary" id="logoutBtn">Abmelden</button></header>`;
  }
  function bindLogout() { document.getElementById("logoutBtn").onclick = () => { SESSION=null; setSession(null); render(); }; }

  /* ---- Chef-Ansicht ---- */
  function renderChef() {
    const openAnfragen = DATA.anfragen.filter(a => !a.erledigt);
    root.innerHTML = `
      ${topbar("Chef")}
      <main>
        <div class="section">
          <h2>Mitarbeiter</h2>
          <div id="empList">${DATA.employees.length ? DATA.employees.map(e=>`<span class="emp-chip">${esc(e.name)} <button data-del="${e.id}">✕</button></span>`).join("") : `<div class="empty">Noch keine Mitarbeiter.</div>`}</div>
          <div class="row" style="margin-top:12px;">
            <input id="newEmpName" placeholder="Name" />
            <input id="newEmpPw" placeholder="Passwort" />
            <button class="btn-secondary" id="addEmpBtn">Anlegen</button>
          </div>
        </div>

        <div class="section">
          <h2>Termin anlegen</h2>
          <div class="row">
            <select id="tEmp">${DATA.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("") || `<option disabled>Erst Mitarbeiter anlegen</option>`}</select>
            <input id="tDate" type="date" value="${todayStr()}" />
            <input id="tTime" type="time" />
          </div>
          <div class="row" style="margin-top:8px;">
            <input id="tTitle" placeholder="Titel / Baustelle" />
            <input id="tOrt" placeholder="Ort" />
          </div>
          <input id="tNotiz" placeholder="Notiz / Anweisung" style="margin-top:8px;" />
          <button class="btn-primary" id="addTerminBtn">Termin speichern</button>
        </div>

        <div class="section">
          <h2>Anfragen von Mitarbeitern ${openAnfragen.length ? `<span class="badge anfrage">${openAnfragen.length} offen</span>`:""}</h2>
          ${DATA.anfragen.length ? DATA.anfragen.slice().reverse().map(a => {
            const t = DATA.termine.find(x=>x.id===a.termineId);
            const emp = DATA.employees.find(e=>e.id===a.employeeId);
            return `<div class="anfrage-box">
              <strong>${esc(emp?emp.name:"?")}</strong> zu "${esc(t?t.title:"gelöschter Termin")}": ${esc(a.text)}
              ${a.erledigt ? `<span class="badge offen" style="margin-left:6px;">erledigt</span>` : `<button class="link-btn" style="margin-left:8px;" data-doneReq="${a.id}">als erledigt markieren</button>`}
            </div>`;
          }).join("") : `<div class="empty">Keine Anfragen.</div>`}
        </div>

        <div class="section">
          <h2>Alle Termine</h2>
          ${DATA.termine.length ? DATA.termine.slice().reverse().map(t => {
            const emp = DATA.employees.find(e=>e.id===t.employeeId);
            return `<div class="termin">
              <div class="t-head"><span>${esc(t.title)}</span><button class="btn-danger" data-delT="${t.id}">Löschen</button></div>
              <div class="t-meta">${esc(emp?emp.name:"?")} · ${esc(t.date)} ${esc(t.time||"")} ${t.ort?`· ${esc(t.ort)}`:""}</div>
              ${t.notiz?`<div class="t-meta">${esc(t.notiz)}</div>`:""}
            </div>`;
          }).join("") : `<div class="empty">Noch keine Termine.</div>`}
        </div>
      </main>`;
    bindLogout();
    document.getElementById("addEmpBtn").onclick = async () => {
      const name = document.getElementById("newEmpName").value.trim();
      const pw = document.getElementById("newEmpPw").value.trim();
      if (!name || !pw) return;
      DATA.employees.push({ id: uid(), name, password: pw });
      await saveData(DATA); render();
    };
    root.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if (!confirm("Mitarbeiter wirklich entfernen?")) return;
      DATA.employees = DATA.employees.filter(e => e.id !== b.dataset.del);
      await saveData(DATA); render();
    });
    const addTerminBtn = document.getElementById("addTerminBtn");
    if (addTerminBtn) addTerminBtn.onclick = async () => {
      const employeeId = document.getElementById("tEmp").value;
      const title = document.getElementById("tTitle").value.trim();
      const date = document.getElementById("tDate").value;
      if (!employeeId || !title || !date) return;
      DATA.termine.push({
        id: uid(), employeeId, title, date,
        time: document.getElementById("tTime").value,
        ort: document.getElementById("tOrt").value.trim(),
        notiz: document.getElementById("tNotiz").value.trim(),
      });
      await saveData(DATA); render();
    };
    root.querySelectorAll("[data-delT]").forEach(b => b.onclick = async () => {
      DATA.termine = DATA.termine.filter(t => t.id !== b.dataset.delT);
      DATA.anfragen = DATA.anfragen.filter(a => a.termineId !== b.dataset.delT);
      await saveData(DATA); render();
    });
    root.querySelectorAll("[data-doneReq]").forEach(b => b.onclick = async () => {
      const a = DATA.anfragen.find(x => x.id === b.dataset.doneReq);
      if (a) a.erledigt = true;
      await saveData(DATA); render();
    });
  }

  /* ---- Mitarbeiter-Ansicht ---- */
  function renderMitarbeiter() {
    const emp = DATA.employees.find(e => e.id === SESSION.id);
    if (!emp) { SESSION = null; setSession(null); return renderLogin(); }
    const meine = DATA.termine.filter(t => t.employeeId === emp.id).sort((a,b)=>a.date.localeCompare(b.date));
    root.innerHTML = `
      ${topbar(emp.name)}
      <main>
        <div class="section">
          <h2>Meine Termine</h2>
          ${meine.length ? meine.map(t => {
            const meineAnfragen = DATA.anfragen.filter(a => a.termineId === t.id);
            return `<div class="termin">
              <div class="t-head"><span>${esc(t.title)}</span></div>
              <div class="t-meta">${esc(t.date)} ${esc(t.time||"")} ${t.ort?`· ${esc(t.ort)}`:""}</div>
              ${t.notiz?`<div class="t-meta">Anweisung: ${esc(t.notiz)}</div>`:""}
              ${meineAnfragen.map(a=>`<div class="anfrage-box">Deine Anfrage: ${esc(a.text)} ${a.erledigt?'<span class="badge offen">erledigt</span>':'<span class="badge anfrage">offen</span>'}</div>`).join("")}
              <button class="link-btn" style="margin-top:6px;" data-req="${t.id}">Anfrage stellen (z.B. kann nicht)</button>
            </div>`;
          }).join("") : `<div class="empty">Keine Termine geplant.</div>`}
        </div>
      </main>`;
    bindLogout();
    root.querySelectorAll("[data-req]").forEach(b => b.onclick = async () => {
      const text = prompt("Deine Anfrage / Nachricht zu diesem Termin:");
      if (!text) return;
      DATA.anfragen.push({ id: uid(), termineId: b.dataset.req, employeeId: emp.id, text, erledigt:false });
      await saveData(DATA); render();
    });
  }

  render();
</script>
</body>
</html>
