<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Heinrich Schmid – Team-Planer</title>
<style>
  :root { --blue:#1d4ed8; --blue-dk:#12306b; --yellow:#f5c518; --ink:#111418; --paper:#ffffff; --bg:#f2f4f7; --grey:#66768E; }
  * { box-sizing: border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; height:100%; }
  body { margin:0; min-height:100%; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  #root { min-height:100dvh; }
  .center { min-height:100dvh; display:flex; align-items:flex-start; justify-content:center; padding:8vh 16px 40px; overflow-y:auto; }
  .card { background:var(--paper); border-radius:16px; padding:26px; width:100%; max-width:380px; box-shadow:0 10px 30px rgba(17,20,24,.12); border-top:5px solid var(--yellow); }
  h1 { font-size:20px; margin:0 0 4px; color:var(--blue-dk); }
  .sub { font-size:13px; color:var(--grey); margin-bottom:18px; }
  label { font-size:13px; color:#44586e; display:block; margin:10px 0 4px; }
  input, select { width:100%; padding:12px; border:1.5px solid #dbe2ea; border-radius:8px; font-size:16px; transition:border-color .15s; touch-action:manipulation; }
  input:focus, select:focus { outline:none; border-color:var(--blue); }
  button { cursor:pointer; border:none; border-radius:8px; font-weight:600; font-size:14px; transition:transform .1s, opacity .15s; touch-action:manipulation; min-height:40px; }
  button:hover { opacity:.9; }
  button:active { transform:scale(.97); }
  .btn-primary { background:var(--blue); color:#fff; padding:12px; width:100%; margin-top:16px; font-size:15px; }
  .btn-secondary { background:var(--ink); color:#fff; padding:9px 14px; }
  .btn-danger { background:#111; color:#fff; padding:7px 10px; font-size:12px; opacity:.55; }
  .btn-danger:hover { opacity:1; background:#b91c1c; }
  .err { color:#b91c1c; font-size:12.5px; margin-top:8px; }
  .rolebtns { display:flex; gap:8px; margin-bottom:18px; }
  .rolebtns button { flex:1; padding:10px; border-radius:8px; background:#eef1f5; color:#44586e; }
  .rolebtns button.active { background:var(--blue-dk); color:#fff; }
  header.topbar { background:linear-gradient(90deg,var(--blue-dk),var(--blue)); color:#fff; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:4px solid var(--yellow); position:sticky; top:0; z-index:5; }
  header.topbar strong { font-size:15px; }
  header.topbar .who { font-size:12.5px; opacity:.85; }
  main { max-width:780px; margin:0 auto; padding:16px 14px 90px; }
  .section { background:var(--paper); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 2px 10px rgba(17,20,24,.06); }
  .section h2 { font-size:15px; margin:0 0 12px; color:var(--blue-dk); display:flex; align-items:center; gap:6px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:120px; }
  .termin { border:1px solid #e6eaf0; border-left:4px solid var(--blue); border-radius:10px; padding:12px 14px; margin-bottom:10px; transition:box-shadow .15s; }
  .termin:hover { box-shadow:0 3px 10px rgba(17,20,24,.08); }
  .termin .t-head { display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:14px; gap:8px; }
  .termin .t-meta { font-size:12.5px; color:var(--grey); margin-top:4px; }
  .badge { font-size:11px; padding:2px 9px; border-radius:20px; font-weight:700; white-space:nowrap; }
  .badge.offen { background:#e8f0ff; color:var(--blue); }
  .badge.anfrage { background:#fff6d8; color:#8a6600; }
  .anfrage-box { margin-top:8px; font-size:12.5px; background:#fffaea; border:1px solid var(--yellow); border-radius:8px; padding:8px 10px; }
  .link-btn { background:none; color:var(--blue); font-size:12.5px; padding:0; text-decoration:underline; min-height:auto; }
  .emp-chip { display:inline-flex; align-items:center; gap:6px; background:var(--ink); color:#fff; border-radius:20px; padding:5px 10px 5px 12px; font-size:12.5px; margin:3px 4px 3px 0; }
  .emp-chip button { background:none; color:var(--yellow); font-size:13px; padding:0 2px; min-height:auto; }
  .empty { color:#8a97a6; font-size:13px; text-align:center; padding:14px; }
  /* Kalender */
  .cal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .cal-head button { background:#eef1f5; color:var(--blue-dk); padding:6px 14px; border-radius:8px; }
  .cal-head .lbl { font-weight:700; color:var(--blue-dk); text-transform:capitalize; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-dow { font-size:10.5px; color:var(--grey); text-align:center; font-weight:700; padding-bottom:2px; }
  .cal-day { position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:13px; background:#f6f8fb; cursor:default; min-height:34px; }
  .cal-day.pad { background:transparent; }
  .cal-day.today { border:1.5px solid var(--blue); font-weight:700; }
  .cal-day.has { background:var(--blue); color:#fff; font-weight:700; cursor:pointer; }
  .cal-day.has.sel { background:var(--yellow); color:var(--ink); }
  .cal-day .dot { position:absolute; bottom:3px; width:4px; height:4px; border-radius:50%; background:var(--yellow); }
  .cal-daylist { margin-top:14px; }
  /* Stat-Karten (Dashboard) */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:10px; margin-bottom:4px; }
  .stat { background:#f6f8fb; border-radius:10px; padding:12px; text-align:center; border-bottom:3px solid var(--yellow); }
  .stat .num { font-size:22px; font-weight:800; color:var(--blue-dk); }
  .stat .lbl { font-size:11px; color:var(--grey); margin-top:2px; }
  /* Bottom-Navigation */
  nav.bottomnav { position:fixed; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid #e2e6ec; display:flex; z-index:6; padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -3px 12px rgba(17,20,24,.06); }
  nav.bottomnav button { flex:1; background:none; padding:10px 4px 8px; border-radius:0; font-size:11px; color:var(--grey); display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav.bottomnav button .ic { font-size:19px; }
  nav.bottomnav button.active { color:var(--blue); }
  nav.bottomnav button.active .ic { filter:none; }
  nav.bottomnav button.active::before { content:""; position:absolute; }
</style>
</head>
<body>
<div id="root"><div class="center">Wird geladen …</div></div>

<script type="module">
  /* ---- Firebase / Speicher-Backend (geräteübergreifend synchron) ---- */
  const firebaseConfig = {
    apiKey: "AIzaSyAUOLTCYtr7fQc4kP3j-t6lsgAK4BIEgw8",
    authDomain: "hs-planer-104d7.firebaseapp.com",
    projectId: "hs-planer-104d7",
    storageBucket: "hs-planer-104d7.firebasestorage.app",
    messagingSenderId: "921699904238",
    appId: "1:921699904238:web:a05c701a4b6e1c3d7fe1ff",
  };
  function localFallback() {
    window.storage = {
      async get(key, shared) { const raw = localStorage.getItem("mf_"+(shared?"s_":"p_")+key); return raw===null?null:{key,value:raw,shared:!!shared}; },
      async set(key, value, shared) { localStorage.setItem("mf_"+(shared?"s_":"p_")+key, value); return {key,value,shared:!!shared}; },
    };
  }
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
    const { getFirestore, doc, getDoc, setDoc } = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js");
    const fbApp = initializeApp(firebaseConfig);
    const fs = getFirestore(fbApp);
    window.storage = {
      async get(key, shared) {
        if (!shared) { const raw = localStorage.getItem("mf_p_"+key); return raw===null?null:{key,value:raw,shared:false}; }
        const snap = await getDoc(doc(fs, "malerfirma_shared", key));
        return snap.exists() ? {key, value:snap.data().value, shared:true} : null;
      },
      async set(key, value, shared) {
        if (!shared) { localStorage.setItem("mf_p_"+key, value); return {key,value,shared:false}; }
        await setDoc(doc(fs, "malerfirma_shared", key), {value, updatedAt: Date.now()});
        return {key,value,shared:true};
      },
    };
  } catch (e) { console.warn("Firebase nicht verfügbar, nutze lokalen Speicher:", e); localFallback(); }

  /* ---------------------------- App-Logik ---------------------------- */
  const root = document.getElementById("root");
  const uid = () => Math.random().toString(36).slice(2,9);
  const todayStr = () => new Date().toISOString().slice(0,10);
  const DOW = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

  async function loadData() {
    const r = await window.storage.get("mf_data", true);
    if (r) { try { return JSON.parse(r.value); } catch(e) {} }
    return { chefPassword: null, employees: [], termine: [], anfragen: [] };
  }
  async function saveData(d) { await window.storage.set("mf_data", JSON.stringify(d), true); }

  function getSession() {
    try { return JSON.parse(localStorage.getItem("mf_session") || "null"); } catch(e) { return null; }
  }
  function setSession(s) { s ? localStorage.setItem("mf_session", JSON.stringify(s)) : localStorage.removeItem("mf_session"); }

  let DATA = await loadData();
  let SESSION = getSession();
  let calCursor = todayStr().slice(0,7);
  let calSelDay = todayStr();
  let chefTab = "dashboard";
  let mitTab = "dashboard";

  function esc(s) { return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  async function render() {
    DATA = await loadData();
    if (!SESSION) return renderLogin();
    if (SESSION.role === "chef") return renderChef();
    return renderMitarbeiter();
  }

  /* ---- Login ---- */
  function renderLogin() {
    let mode = "mitarbeiter";
    root.innerHTML = `
      <div class="center"><div class="card">
        <h1>🎨 Heinrich Schmid</h1>
        <div class="sub">Team-Planer – Anmeldung</div>
        <div class="rolebtns">
          <button id="mMit" class="active">Mitarbeiter</button>
          <button id="mChef">Chef</button>
        </div>
        <div id="loginFields"></div>
        <div id="loginErr" class="err"></div>
      </div></div>`;
    const fields = document.getElementById("loginFields");
    function drawFields() {
      if (mode === "mitarbeiter") {
        fields.innerHTML = `
          <label>Name</label>
          <select id="empSel">${DATA.employees.length ? DATA.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("") : `<option disabled selected>Noch keine Mitarbeiter angelegt</option>`}</select>
          <label>Passwort</label>
          <input type="password" id="empPw" />
          <button class="btn-primary" id="loginBtn" type="button">Anmelden</button>`;
      } else {
        fields.innerHTML = `
          <label>Passwort</label>
          <input type="password" id="chefPw" />
          <button class="btn-primary" id="loginBtn" type="button">${DATA.chefPassword ? "Anmelden" : "Chef-Passwort festlegen"}</button>`;
      }
      document.getElementById("loginBtn").onclick = doLogin;
    }
    document.getElementById("mMit").onclick = () => { mode="mitarbeiter"; document.getElementById("mMit").classList.add("active"); document.getElementById("mChef").classList.remove("active"); drawFields(); };
    document.getElementById("mChef").onclick = () => { mode="chef"; document.getElementById("mChef").classList.add("active"); document.getElementById("mMit").classList.remove("active"); drawFields(); };
    drawFields();

    async function doLogin() {
      const errEl = document.getElementById("loginErr");
      errEl.textContent = "";
      if (mode === "chef") {
        const pw = document.getElementById("chefPw").value;
        if (!pw) { errEl.textContent = "Bitte Passwort eingeben."; return; }
        if (!DATA.chefPassword) {
          DATA.chefPassword = pw; await saveData(DATA);
          SESSION = { role:"chef" }; setSession(SESSION); return render();
        }
        if (pw !== DATA.chefPassword) { errEl.textContent = "Falsches Passwort."; return; }
        SESSION = { role:"chef" }; setSession(SESSION); return render();
      } else {
        const sel = document.getElementById("empSel");
        const pw = document.getElementById("empPw").value;
        const emp = DATA.employees.find(e => e.id === sel.value);
        if (!emp) { errEl.textContent = "Kein Mitarbeiter ausgewählt."; return; }
        if (pw !== emp.password) { errEl.textContent = "Falsches Passwort."; return; }
        SESSION = { role:"mitarbeiter", id: emp.id }; setSession(SESSION); return render();
      }
    }
  }

  function topbar(name) {
    return `<header class="topbar"><div><strong>🎨 Heinrich Schmid</strong><br><span class="who">${esc(name)}</span></div>
      <button class="btn-secondary" id="logoutBtn" type="button">Abmelden</button></header>`;
  }
  function bindLogout() { document.getElementById("logoutBtn").onclick = () => { SESSION=null; setSession(null); render(); }; }

  function bottomNav(items, active, onPick) {
    return `<nav class="bottomnav">${items.map(it => `<button data-tab="${it.key}" class="${it.key===active?"active":""}" type="button"><span class="ic">${it.icon}</span>${it.label}</button>`).join("")}</nav>`;
  }
  function bindNav(onPick) {
    root.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => onPick(b.dataset.tab));
  }

  /* ==================== Chef ==================== */
  const CHEF_TABS = [
    { key:"dashboard", label:"Dashboard", icon:"📊" },
    { key:"termine", label:"Termine", icon:"📅" },
    { key:"team", label:"Team", icon:"👷" },
    { key:"anfragen", label:"Anfragen", icon:"🔔" },
  ];
  function renderChef() {
    const openAnfragen = DATA.anfragen.filter(a => !a.erledigt);
    const upcoming = DATA.termine.filter(t => t.date >= todayStr()).sort((a,b)=>a.date.localeCompare(b.date));
    let body = "";
    if (chefTab === "dashboard") {
      body = `
        <div class="section">
          <h2>📊 Überblick</h2>
          <div class="stats">
            <div class="stat"><div class="num">${DATA.employees.length}</div><div class="lbl">Mitarbeiter</div></div>
            <div class="num-wrap"></div>
            <div class="stat"><div class="num">${upcoming.length}</div><div class="lbl">Kommende Termine</div></div>
            <div class="stat"><div class="num">${openAnfragen.length}</div><div class="lbl">Offene Anfragen</div></div>
          </div>
        </div>
        <div class="section">
          <h2>⏭️ Nächste Termine</h2>
          ${upcoming.length ? upcoming.slice(0,4).map(t => {
            const emp = DATA.employees.find(e=>e.id===t.employeeId);
            return `<div class="termin"><div class="t-head"><span>${esc(t.title)}</span></div>
              <div class="t-meta">👤 ${esc(emp?emp.name:"?")} · 📅 ${esc(t.date)} ${esc(t.time||"")}</div></div>`;
          }).join("") : `<div class="empty">Keine anstehenden Termine.</div>`}
        </div>`;
    } else if (chefTab === "team") {
      body = `
        <div class="section">
          <h2>👷 Mitarbeiter</h2>
          <div id="empList">${DATA.employees.length ? DATA.employees.map(e=>`<span class="emp-chip">${esc(e.name)} <button data-del="${e.id}" type="button">✕</button></span>`).join("") : `<div class="empty">Noch keine Mitarbeiter.</div>`}</div>
          <div class="row" style="margin-top:12px;">
            <input id="newEmpName" placeholder="Name" />
            <input id="newEmpPw" placeholder="Passwort" />
            <button class="btn-secondary" id="addEmpBtn" type="button">Anlegen</button>
          </div>
        </div>
        <div class="section">
          <h2>🔑 Mein Passwort ändern</h2>
          <div class="row">
            <input id="newChefPw" type="password" placeholder="Neues Passwort" />
            <button class="btn-secondary" id="chgChefPwBtn" type="button">Ändern</button>
          </div>
        </div>`;
    } else if (chefTab === "termine") {
      body = `
        <div class="section">
          <h2>➕ Termin anlegen</h2>
          <div class="row">
            <select id="tEmp">${DATA.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("") || `<option disabled>Erst Mitarbeiter anlegen</option>`}</select>
            <input id="tDate" type="date" value="${todayStr()}" />
            <input id="tTime" type="time" />
          </div>
          <div class="row" style="margin-top:8px;">
            <input id="tTitle" placeholder="Titel / Baustelle" />
            <input id="tOrt" placeholder="Ort" />
          </div>
          <input id="tNotiz" placeholder="Notiz / Anweisung" style="margin-top:8px;" />
          <button class="btn-primary" id="addTerminBtn" type="button">Termin speichern</button>
        </div>
        <div class="section">
          <h2>📋 Alle Termine</h2>
          ${DATA.termine.length ? DATA.termine.slice().reverse().map(t => {
            const emp = DATA.employees.find(e=>e.id===t.employeeId);
            return `<div class="termin">
              <div class="t-head"><span>${esc(t.title)}</span><button class="btn-danger" data-delT="${t.id}" type="button">Löschen</button></div>
              <div class="t-meta">👤 ${esc(emp?emp.name:"?")} · 📅 ${esc(t.date)} ${esc(t.time||"")} ${t.ort?`· 📍 ${esc(t.ort)}`:""}</div>
              ${t.notiz?`<div class="t-meta">📝 ${esc(t.notiz)}</div>`:""}
            </div>`;
          }).join("") : `<div class="empty">Noch keine Termine.</div>`}
        </div>`;
    } else if (chefTab === "anfragen") {
      body = `
        <div class="section">
          <h2>🔔 Anfragen von Mitarbeitern ${openAnfragen.length ? `<span class="badge anfrage">${openAnfragen.length} offen</span>`:""}</h2>
          ${DATA.anfragen.length ? DATA.anfragen.slice().reverse().map(a => {
            const t = DATA.termine.find(x=>x.id===a.termineId);
            const emp = DATA.employees.find(e=>e.id===a.employeeId);
            return `<div class="anfrage-box">
              <strong>${esc(emp?emp.name:"?")}</strong> zu "${esc(t?t.title:"gelöschter Termin")}": ${esc(a.text)}
              ${a.erledigt ? `<span class="badge offen" style="margin-left:6px;">erledigt</span>` : `<button class="link-btn" style="margin-left:8px;" data-doneReq="${a.id}" type="button">als erledigt markieren</button>`}
            </div>`;
          }).join("") : `<div class="empty">Keine Anfragen.</div>`}
        </div>`;
    }
    root.innerHTML = `${topbar("Chef")}<main>${body}</main>${bottomNav(CHEF_TABS, chefTab)}`;
    bindLogout();
    bindNav(k => { chefTab = k; render(); });

    const addEmpBtn = document.getElementById("addEmpBtn");
    if (addEmpBtn) addEmpBtn.onclick = async () => {
      const name = document.getElementById("newEmpName").value.trim();
      const pw = document.getElementById("newEmpPw").value.trim();
      if (!name || !pw) return;
      DATA.employees.push({ id: uid(), name, password: pw });
      await saveData(DATA); render();
    };
    const chgChefPwBtn = document.getElementById("chgChefPwBtn");
    if (chgChefPwBtn) chgChefPwBtn.onclick = async () => {
      const pw = document.getElementById("newChefPw").value.trim();
      if (!pw) return;
      DATA.chefPassword = pw; await saveData(DATA);
      document.getElementById("newChefPw").value = ""; alert("Passwort geändert.");
    };
    root.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if (!confirm("Mitarbeiter wirklich entfernen?")) return;
      DATA.employees = DATA.employees.filter(e => e.id !== b.dataset.del);
      await saveData(DATA); render();
    });
    const addTerminBtn = document.getElementById("addTerminBtn");
    if (addTerminBtn) addTerminBtn.onclick = async () => {
      const employeeId = document.getElementById("tEmp").value;
      const title = document.getElementById("tTitle").value.trim();
      const date = document.getElementById("tDate").value;
      if (!employeeId || !title || !date) return;
      DATA.termine.push({
        id: uid(), employeeId, title, date,
        time: document.getElementById("tTime").value,
        ort: document.getElementById("tOrt").value.trim(),
        notiz: document.getElementById("tNotiz").value.trim(),
      });
      await saveData(DATA); render();
    };
    root.querySelectorAll("[data-delT]").forEach(b => b.onclick = async () => {
      DATA.termine = DATA.termine.filter(t => t.id !== b.dataset.delT);
      DATA.anfragen = DATA.anfragen.filter(a => a.termineId !== b.dataset.delT);
      await saveData(DATA); render();
    });
    root.querySelectorAll("[data-doneReq]").forEach(b => b.onclick = async () => {
      const a = DATA.anfragen.find(x => x.id === b.dataset.doneReq);
      if (a) a.erledigt = true;
      await saveData(DATA); render();
    });
  }

  /* ==================== Mitarbeiter ==================== */
  const MIT_TABS = [
    { key:"dashboard", label:"Dashboard", icon:"📊" },
    { key:"kalender", label:"Kalender", icon:"📅" },
    { key:"anfragen", label:"Anfragen", icon:"🔔" },
    { key:"profil", label:"Profil", icon:"👤" },
  ];
  function renderMitarbeiter() {
    const emp = DATA.employees.find(e => e.id === SESSION.id);
    if (!emp) { SESSION = null; setSession(null); return renderLogin(); }
    const meine = DATA.termine.filter(t => t.employeeId === emp.id);
    const meineAnfragen = DATA.anfragen.filter(a => a.employeeId === emp.id);
    const upcoming = meine.filter(t => t.date >= todayStr()).sort((a,b)=>a.date.localeCompare(b.date));

    let body = "";
    if (mitTab === "dashboard") {
      const next = upcoming[0];
      body = `
        <div class="section">
          <h2>📊 Überblick</h2>
          <div class="stats">
            <div class="stat"><div class="num">${upcoming.length}</div><div class="lbl">Kommende Termine</div></div>
            <div class="stat"><div class="num">${meineAnfragen.filter(a=>!a.erledigt).length}</div><div class="lbl">Offene Anfragen</div></div>
          </div>
        </div>
        <div class="section">
          <h2>⏭️ Nächster Termin</h2>
          ${next ? `<div class="termin"><div class="t-head"><span>${esc(next.title)}</span></div>
            <div class="t-meta">📅 ${esc(next.date)} ${esc(next.time||"")} ${next.ort?`· 📍 ${esc(next.ort)}`:""}</div>
            ${next.notiz?`<div class="t-meta">📝 ${esc(next.notiz)}</div>`:""}</div>`
            : `<div class="empty">Keine anstehenden Termine.</div>`}
        </div>`;
    } else if (mitTab === "kalender") {
      const byDay = {};
      meine.forEach(t => { (byDay[t.date] = byDay[t.date] || []).push(t); });
      const [cy, cm] = calCursor.split("-").map(Number);
      const first = new Date(cy, cm-1, 1);
      const startOffset = (first.getDay() + 6) % 7;
      const daysInMonth = new Date(cy, cm, 0).getDate();
      let cells = "";
      for (let i=0;i<startOffset;i++) cells += `<div class="cal-day pad"></div>`;
      for (let d=1; d<=daysInMonth; d++) {
        const ds = `${cy}-${String(cm).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const has = byDay[ds];
        const cls = ["cal-day"];
        if (ds === todayStr()) cls.push("today");
        if (has) cls.push("has");
        if (ds === calSelDay) cls.push("sel");
        cells += `<div class="${cls.join(" ")}" ${has?`data-day="${ds}"`:""}>${d}${has?'<span class="dot"></span>':""}</div>`;
      }
      const selList = byDay[calSelDay] || [];
      body = `
        <div class="section">
          <h2>📅 Mein Kalender</h2>
          <div class="cal-head"><button id="calPrev" type="button">‹</button><span class="lbl">${MONTHS[cm-1]} ${cy}</span><button id="calNext" type="button">›</button></div>
          <div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("")}${cells}</div>
          <div class="cal-daylist">
            <div style="font-size:12.5px;color:var(--grey);margin-bottom:6px;">Termine am ${calSelDay.split("-").reverse().join(".")}</div>
            ${selList.length ? selList.map(t => `<div class="termin">
              <div class="t-head"><span>${esc(t.title)}</span></div>
              <div class="t-meta">🕐 ${esc(t.time||"–")} ${t.ort?`· 📍 ${esc(t.ort)}`:""}</div>
              ${t.notiz?`<div class="t-meta">📝 ${esc(t.notiz)}</div>`:""}
              ${DATA.anfragen.filter(a=>a.termineId===t.id).map(a=>`<div class="anfrage-box">Deine Anfrage: ${esc(a.text)} ${a.erledigt?'<span class="badge offen">erledigt</span>':'<span class="badge anfrage">offen</span>'}</div>`).join("")}
              <button class="link-btn" style="margin-top:6px;" data-req="${t.id}" type="button">Anfrage stellen (z.B. kann nicht)</button>
            </div>`).join("") : `<div class="empty">Keine Termine an diesem Tag.</div>`}
          </div>
        </div>`;
    } else if (mitTab === "anfragen") {
      body = `
        <div class="section">
          <h2>🔔 Meine Anfragen</h2>
          ${meineAnfragen.length ? meineAnfragen.slice().reverse().map(a => {
            const t = DATA.termine.find(x=>x.id===a.termineId);
            return `<div class="anfrage-box">Zu "${esc(t?t.title:"gelöschter Termin")}": ${esc(a.text)} ${a.erledigt?'<span class="badge offen">erledigt</span>':'<span class="badge anfrage">offen</span>'}</div>`;
          }).join("") : `<div class="empty">Noch keine Anfragen gestellt.</div>`}
        </div>`;
    } else if (mitTab === "profil") {
      body = `
        <div class="section">
          <h2>👤 Profil</h2>
          <div class="t-meta" style="margin-bottom:10px;">Name: <strong>${esc(emp.name)}</strong></div>
          <label>Neues Passwort</label>
          <input id="newEmpPw2" type="password" placeholder="Neues Passwort" />
          <button class="btn-primary" id="chgEmpPwBtn" type="button">Passwort ändern</button>
        </div>`;
    }
    root.innerHTML = `${topbar(emp.name)}<main>${body}</main>${bottomNav(MIT_TABS, mitTab)}`;
    bindLogout();
    bindNav(k => { mitTab = k; render(); });

    const calPrev = document.getElementById("calPrev");
    if (calPrev) calPrev.onclick = () => { const [y,m]=calCursor.split("-").map(Number); const d=new Date(y,m-2,1); calCursor=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; render(); };
    const calNext = document.getElementById("calNext");
    if (calNext) calNext.onclick = () => { const [y,m]=calCursor.split("-").map(Number); const d=new Date(y,m,1); calCursor=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; render(); };
    root.querySelectorAll("[data-day]").forEach(el => el.onclick = () => { calSelDay = el.dataset.day; render(); });
    root.querySelectorAll("[data-req]").forEach(b => b.onclick = async () => {
      const text = prompt("Deine Anfrage / Nachricht zu diesem Termin:");
      if (!text) return;
      DATA.anfragen.push({ id: uid(), termineId: b.dataset.req, employeeId: emp.id, text, erledigt:false });
      await saveData(DATA); render();
    });
    const chgEmpPwBtn = document.getElementById("chgEmpPwBtn");
    if (chgEmpPwBtn) chgEmpPwBtn.onclick = async () => {
      const pw = document.getElementById("newEmpPw2").value.trim();
      if (!pw) return;
      emp.password = pw; await saveData(DATA);
      alert("Passwort geändert."); render();
    };
  }

  render();
</script>
</body>
</html>
