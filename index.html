<script type="module">
  /* ======================================================================
     FIREBASE-KONFIGURATION
     ----------------------------------------------------------------------
     Trage hier die Konfigurationswerte deines eigenen Firebase-Projekts
     ein. Du findest sie in der Firebase-Console unter:
     Projekteinstellungen -> "Meine Apps" -> Web-App -> SDK-Konfiguration.

     Kurzanleitung:
     1. https://console.firebase.google.com öffnen, neues Projekt anlegen
        (kostenloser "Spark"-Plan reicht).
     2. Im Projekt: "Firestore Database" -> "Datenbank erstellen"
        -> Testmodus wählen (oder Regeln s.u. verwenden).
     3. Unter "Projektübersicht" -> Zahnrad -> "Projekteinstellungen"
        -> "Meine Apps" -> "</> Web" -> App registrieren.
     4. Die angezeigten Werte unten eintragen.

     Sicherheitsregeln (Firestore -> Regeln), da diese App ohne Login-
     Prüfung auf Firebase-Ebene arbeitet (die App-eigene Anmeldung bleibt
     wie gehabt bestehen, sichert aber nicht die Datenbank selbst ab):

       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /malerfirma_shared/{docId} {
             allow read, write: if true; // Testmodus – siehe Hinweis unten
           }
         }
       }

     Hinweis: "allow read, write: if true" macht die Daten für jeden mit
     der Projekt-URL lesbar/schreibbar. Für eine echte Firmen-App sollte
     hier eine Firebase-Authentifizierung ergänzt und die Regel auf
     angemeldete Nutzer eingeschränkt werden (allow read, write: if
     request.auth != null). Für eine einfache interne Team-Lösung reicht
     der Testmodus oft aus, solange die URL nicht öffentlich geteilt wird.
     ====================================================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyAUOLTCYtr7fQc4kP3j-t6lsgAK4BIEgw8",
    authDomain: "hs-planer-104d7.firebaseapp.com",
    projectId: "hs-planer-104d7",
    storageBucket: "hs-planer-104d7.firebasestorage.app",
    messagingSenderId: "921699904238",
    appId: "1:921699904238:web:a05c701a4b6e1c3d7fe1ff",
    measurementId: "G-XDHZE35MPB",
  };

  const FIREBASE_CONFIGURED = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("DEIN_");

  function fullKeyPrivate(key) {
    return "malerfirma_private_" + key;
  }

  if (!FIREBASE_CONFIGURED) {
    // Kein Firebase eingerichtet -> Fallback auf localStorage (nur dieses Gerät).
    console.warn("Firebase ist nicht konfiguriert – Daten werden nur lokal in diesem Browser gespeichert. Siehe Kommentar im <head> der Datei.");
    window.storage = {
      async get(key, shared) {
        const raw = localStorage.getItem("malerfirma_" + (shared ? "shared_" : "private_") + key);
        if (raw === null) return null;
        return { key, value: raw, shared: !!shared };
      },
      async set(key, value, shared) {
        localStorage.setItem("malerfirma_" + (shared ? "shared_" : "private_") + key, value);
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        localStorage.removeItem("malerfirma_" + (shared ? "shared_" : "private_") + key);
        return { key, deleted: true, shared: !!shared };
      },
      async list() { return { keys: [] }; },
    };
  } else {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
    const { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot } =
      await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js");

    const fbApp = initializeApp(firebaseConfig);
    const fs = getFirestore(fbApp);
    const COLLECTION = "malerfirma_shared";

    window.storage = {
      async get(key, shared) {
        if (!shared) {
          const raw = localStorage.getItem(fullKeyPrivate(key));
          return raw === null ? null : { key, value: raw, shared: false };
        }
        const snap = await getDoc(doc(fs, COLLECTION, key));
        if (!snap.exists()) return null;
        return { key, value: snap.data().value, shared: true };
      },
      async set(key, value, shared) {
        if (!shared) {
          localStorage.setItem(fullKeyPrivate(key), value);
          return { key, value, shared: false };
        }
        await setDoc(doc(fs, COLLECTION, key), { value, updatedAt: Date.now() });
        return { key, value, shared: true };
      },
      async delete(key, shared) {
        if (!shared) {
          localStorage.removeItem(fullKeyPrivate(key));
          return { key, deleted: true, shared: false };
        }
        await deleteDoc(doc(fs, COLLECTION, key));
        return { key, deleted: true, shared: true };
      },
      async list() { return { keys: [] }; },
    };

    // Live-Sync: liefert Änderungen von anderen Geräten in Echtzeit.
    window.__mfSubscribeDB = function (callback) {
      return onSnapshot(doc(fs, COLLECTION, "db"), (snap) => {
        if (snap.exists()) {
          try { callback(JSON.parse(snap.data().value)); } catch (e) {}
        }
      });
    };
  }
</script>

async function loadDB() {
  try {
    const r = await window.storage.get("db", true);
    if (!r) throw new Error("empty");
    return JSON.parse(r.value);
  } catch {
    const seed = seedDB();
    try { await window.storage.set("db", JSON.stringify(seed), true); } catch {}
    return seed;
  }
}
async function persistDB(db) {
  try { await window.storage.set("db", JSON.stringify(db), true); } catch {}
}
async function loadSession() {
  try {
    const r = await window.storage.get(SESSION_KEY, false);
    if (!r) return null;
    return JSON.parse(r.value);
  } catch { return null; }
}
async function persistSession(s) {
  try {
    if (s) await window.storage.set(SESSION_KEY, JSON.stringify(s), false);
    else await window.storage.delete(SESSION_KEY, false);
  } catch {}
}

  baustelle: { label: "Auf Baustelle", color: "var(--yellow-600)", bg: "var(--yellow-100)" },
  krank: { label: "Krank", color: "var(--red-500)", bg: "var(--red-100)" },
};

function Badge({ children, color, bg }) {
  return <span className="mf-badge" style={{ color, background: bg }}>{children}</span>;
}

function Avatar({ name, size = 34 }) {
  const initials = name.split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase();
  return (
    <div style={{
      width: size, height: size, borderRadius: "50%", background: "var(--blue-100)", color: "var(--blue-700)",
      display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: size * 0.38, flexShrink: 0,
    }}>{initials}</div>
  );
}

function Modal({ title, onClose, children, width = 480 }) {
  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(15,24,38,0.45)", zIndex: 100,
      display: "flex", alignItems: "center", justifyContent: "center", padding: 16,
    }} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="mf-card mf-pop mf-scroll" style={{ width, maxWidth: "100%", maxHeight: "88vh", overflowY: "auto", padding: 22 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
          <h3 className="mf-heading" style={{ fontSize: 18, fontWeight: 800, margin: 0 }}>{title}</h3>
          <button className="mf-btn mf-btn-ghost" style={{ padding: 6 }} onClick={onClose}><X size={16} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function EmptyState({ icon: Icon, text, sub }) {
  return (
    <div style={{ textAlign: "center", padding: "40px 20px", color: "var(--text-muted)" }}>
      <Icon size={30} style={{ marginBottom: 10, opacity: 0.5 }} />
      <div style={{ fontWeight: 600, color: "var(--text)" }}>{text}</div>
      {sub && <div style={{ fontSize: 13, marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

/*  Login                                                                   */

function LoginScreen({ db, onLogin, onRegister }) {
  const [mode, setMode] = useState("login"); // "login" | "register"
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [password2, setPassword2] = useState("");
  const [error, setError] = useState("");

  function switchMode(m) {
    setMode(m);
    setError("");
    setPassword("");
    setPassword2("");
  }

  function submitLogin(e) {
    e.preventDefault();
    const user = db.users.find((u) => u.email.toLowerCase() === email.trim().toLowerCase());
    if (!user || !user.active) { setError("Kein aktives Konto mit dieser E-Mail gefunden."); return; }
    if (user.password !== password) { setError("Passwort ist nicht korrekt."); return; }
    onLogin(user.id);
  }

  function submitRegister(e) {
    e.preventDefault();
    setError("");
    const trimmedName = name.trim();
    const trimmedEmail = email.trim();
    if (!trimmedName) { setError("Bitte gib deinen Namen ein."); return; }
    if (!trimmedEmail) { setError("Bitte gib eine E-Mail-Adresse ein."); return; }
    if (password.length < 4) { setError("Das Passwort muss mindestens 4 Zeichen lang sein."); return; }
    if (password !== password2) { setError("Die Passwörter stimmen nicht überein."); return; }
    if (db.users.some((u) => u.email.toLowerCase() === trimmedEmail.toLowerCase())) {
      setError("Für diese E-Mail existiert bereits ein Konto.");
      return;
    }
    const user = {
      id: uid("u"),
      role: "mitarbeiter",
      name: trimmedName,
      position: "",
      email: trimmedEmail,
      password,
      active: true,
      status: "verfuegbar",
    };
    onRegister(user);
  }

  function quick(u) { setMode("login"); setEmail(u.email); setPassword(u.password); setError(""); }

  return (
    <div className="mf-root" style={{ display: "flex", minHeight: "100vh" }}>
      <GlobalStyle />
      <div style={{ flex: 1, background: "var(--blue-900)", color: "#fff", padding: "56px 48px", display: "flex", flexDirection: "column", justifyContent: "space-between", position: "relative", overflow: "hidden", minHeight: 340 }}>
        <div style={{ position: "absolute", right: -60, bottom: -60, width: 260, height: 260, borderRadius: "50%", background: "rgba(244,180,0,0.08)" }} />
        <div style={{ position: "absolute", right: 40, top: 120, width: 120, height: 26, borderRadius: 13, background: "rgba(244,180,0,0.18)", transform: "rotate(-6deg)" }} />
        <div style={{ display: "flex", alignItems: "center", gap: 12, position: "relative" }}>
          <Logo size={40} />
          <div className="mf-heading" style={{ fontWeight: 800, fontSize: 20 }}>Malerwerk Stuttgart</div>
        </div>
        <div style={{ position: "relative", maxWidth: 380 }}>
          <div className="mf-heading" style={{ fontSize: 34, fontWeight: 800, lineHeight: 1.15, marginBottom: 14 }}>Arbeitsmanager</div>
          <div style={{ fontSize: 15.5, color: "rgba(255,255,255,0.75)", lineHeight: 1.6 }}>
            Alles im Blick: Termine, Mitarbeiter und Aufträge – an einem Ort, für den ganzen Betrieb.
          </div>
        </div>
        <div style={{ fontSize: 12.5, color: "rgba(255,255,255,0.45)", position: "relative" }}>© {new Date().getFullYear()} Malerwerk Stuttgart</div>
      </div>

      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        {mode === "login" ? (
          <form onSubmit={submitLogin} style={{ width: "100%", maxWidth: 360 }} className="mf-fade-in">
            <h2 className="mf-heading" style={{ fontSize: 22, fontWeight: 800, marginBottom: 4 }}>Willkommen zurück</h2>
            <p style={{ color: "var(--text-muted)", fontSize: 14, marginBottom: 24 }}>Melde dich mit deinem Konto an.</p>

            <label className="mf-label">E-Mail</label>
            <input className="mf-input" style={{ marginBottom: 14 }} type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="name@firma.de" required />

            <label className="mf-label">Passwort</label>
            <input className="mf-input" style={{ marginBottom: 8 }} type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••" required />

            <div style={{ textAlign: "right", marginBottom: 16 }}>
              <span style={{ fontSize: 12.5, color: "var(--blue-600)", fontWeight: 600, cursor: "pointer" }}>Passwort vergessen?</span>
            </div>

            {error && <div style={{ background: "var(--red-100)", color: "var(--red-500)", fontSize: 13, padding: "8px 12px", borderRadius: 8, marginBottom: 14 }}>{error}</div>}

            <button type="submit" className="mf-btn mf-btn-primary" style={{ width: "100%", justifyContent: "center", padding: "11px 16px" }}>Einloggen</button>

            <div style={{ textAlign: "center", marginTop: 16, fontSize: 13 }}>
              Noch kein Konto?{" "}
              <span style={{ color: "var(--blue-600)", fontWeight: 700, cursor: "pointer" }} onClick={() => switchMode("register")}>Jetzt registrieren</span>
            </div>

            <div style={{ marginTop: 22, paddingTop: 18, borderTop: "1px solid var(--border)" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "var(--text-muted)", marginBottom: 8 }}>DEMO-ZUGÄNGE</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {db.users.filter(u => u.active).map((u) => (
                  <button type="button" key={u.id} onClick={() => quick(u)} className="mf-btn mf-btn-ghost" style={{ fontSize: 12.5, padding: "6px 10px" }}>
                    {u.role === "chef" ? "👑" : "🎨"} {u.name.split(" ")[0]}
                  </button>
                ))}
              </div>
            </div>
          </form>
        ) : (
          <form onSubmit={submitRegister} style={{ width: "100%", maxWidth: 360 }} className="mf-fade-in">
            <h2 className="mf-heading" style={{ fontSize: 22, fontWeight: 800, marginBottom: 4 }}>Konto erstellen</h2>
            <p style={{ color: "var(--text-muted)", fontSize: 14, marginBottom: 24 }}>Lege dir dein eigenes Mitarbeiter-Konto an.</p>

            <label className="mf-label">Name</label>
            <input className="mf-input" style={{ marginBottom: 14 }} type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Dein Name" required />

            <label className="mf-label">E-Mail</label>
            <input className="mf-input" style={{ marginBottom: 14 }} type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="name@firma.de" required />

            <label className="mf-label">Passwort</label>
            <input className="mf-input" style={{ marginBottom: 14 }} type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="mind. 4 Zeichen" required />

            <label className="mf-label">Passwort wiederholen</label>
            <input className="mf-input" style={{ marginBottom: 8 }} type="password" value={password2} onChange={(e) => setPassword2(e.target.value)} placeholder="••••••" required />

            {error && <div style={{ background: "var(--red-100)", color: "var(--red-500)", fontSize: 13, padding: "8px 12px", borderRadius: 8, marginTop: 6, marginBottom: 14 }}>{error}</div>}

            <button type="submit" className="mf-btn mf-btn-primary" style={{ width: "100%", justifyContent: "center", padding: "11px 16px", marginTop: 6 }}>Konto erstellen</button>

            <div style={{ textAlign: "center", marginTop: 16, fontSize: 13 }}>
              Schon ein Konto?{" "}
              <span style={{ color: "var(--blue-600)", fontWeight: 700, cursor: "pointer" }} onClick={() => switchMode("login")}>Zum Login</span>
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

function StatCard({ label, value, icon: Icon, accent }) {
  return (
    <div className="mf-card" style={{ padding: "16px 18px", flex: 1, minWidth: 130 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <span style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-muted)" }}>{label}</span>
        <div style={{ width: 28, height: 28, borderRadius: 8, background: accent ? "var(--yellow-100)" : "var(--blue-100)", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon size={15} color={accent ? "var(--yellow-600)" : "var(--blue-600)"} />
        </div>
      </div>
      <div className="mf-heading" style={{ fontSize: 26, fontWeight: 800 }}>{value}</div>
    </div>
  );
}

function NextUpList({ items, onOpen }) {
  if (!items.length) return <EmptyState icon={Sparkles} text="Nichts Anstehendes" sub="Für den Rest des Tages ist nichts geplant." />;
  return (
    <div>
      {items.map((a, i) => {
        const meta = CATEGORY_META[a.category] || CATEGORY_META.allgemein;
        return (
          <div key={a.id} style={{ display: "flex", gap: 14 }}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 20 }}>
              <div style={{ width: 10, height: 10, borderRadius: "50%", background: meta.color, marginTop: 4 }} />
              {i < items.length - 1 && <div style={{ width: 2, flex: 1, background: "var(--border)", minHeight: 34 }} />}
            </div>
            <div onClick={() => onOpen && onOpen(a)} style={{ paddingBottom: 20, cursor: onOpen ? "pointer" : "default", flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "var(--blue-700)" }}>{a.start} – {a.end}</div>
              <div style={{ fontWeight: 700, fontSize: 14.5, margin: "2px 0 3px" }}>{a.title}</div>
              {a.location && <div style={{ fontSize: 12.5, color: "var(--text-muted)", display: "flex", alignItems: "center", gap: 4 }}><MapPin size={12} /> {a.location}</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function EmployeeDashboard({ db, me, openAppointment, go }) {
  const todayIso = isoDay(new Date());
  const myAppts = db.appointments.filter((a) => a.employeeIds.includes(me.id));
  const todaysAppts = myAppts.filter((a) => a.date === todayIso).sort((a, b) => a.start.localeCompare(b.start));
  const myTasks = db.tasks.filter((t) => t.assigneeId === me.id);
  const openTasks = myTasks.filter((t) => t.status !== "erledigt");
  const dueToday = myTasks.filter((t) => t.due === todayIso && t.status !== "erledigt");
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const next = todaysAppts.find((a) => {
    const [h, m] = a.start.split(":").map(Number);
    return h * 60 + m >= currentMinutes;
  }) || todaysAppts[0];

  return (
    <div className="mf-fade-in">
      <h1 className="mf-heading" style={{ fontSize: 24, fontWeight: 800, marginBottom: 2 }}>{greetingWord()}, {me.name.split(" ")[0]} 👋</h1>
      <p style={{ color: "var(--text-muted)", fontSize: 14.5, marginBottom: 22 }}>Hier ist dein Arbeitsüberblick für heute.</p>

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 22 }}>
        <div className="mf-card mf-stripe" style={{ padding: "18px 20px", flex: "1 1 220px", color: "#fff", position: "relative", overflow: "hidden" }}>
          <div style={{ fontSize: 12.5, fontWeight: 700, opacity: 0.9, marginBottom: 8 }}>NÄCHSTER TERMIN</div>
          {next ? (
            <>
              <div className="mf-heading" style={{ fontSize: 22, fontWeight: 800 }}>{next.start} Uhr</div>
              <div style={{ fontWeight: 600, marginTop: 4 }}>{next.title}</div>
              {next.location && <div style={{ fontSize: 12.5, marginTop: 4, display: "flex", alignItems: "center", gap: 4, opacity: 0.9 }}><MapPin size={12} /> {next.location}</div>}
            </>
          ) : <div style={{ fontWeight: 600 }}>Heute kein weiterer Termin</div>}
        </div>
        <StatCard label="Heute" value={`${todaysAppts.length} Termine`} icon={CalendarDays} />
        <StatCard label="Aufgaben" value={`${openTasks.length} offen`} icon={CheckSquare} accent />
        <StatCard label="Heute fällig" value={dueToday.length} icon={ClipboardList} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 18 }} className="mf-dash-grid">
        <div className="mf-card" style={{ padding: 20 }}>
          <h3 className="mf-heading" style={{ fontSize: 16, fontWeight: 800, marginBottom: 16 }}>Als Nächstes</h3>
          <NextUpList items={todaysAppts} onOpen={openAppointment} />
        </div>
        <div className="mf-card" style={{ padding: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <h3 className="mf-heading" style={{ fontSize: 16, fontWeight: 800 }}>Offene Aufgaben</h3>
            <span onClick={() => go("tasks")} style={{ fontSize: 12.5, fontWeight: 700, color: "var(--blue-600)", cursor: "pointer" }}>Alle ansehen</span>
          </div>
          {openTasks.length === 0 ? <EmptyState icon={CheckSquare} text="Keine offenen Aufgaben" /> : openTasks.slice(0, 5).map((t) => {
            const p = PRIORITY_META[t.priority];
            return (
              <div key={t.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 0", borderBottom: "1px solid var(--border)" }}>
                <div>
                  <div style={{ fontSize: 13.5, fontWeight: 600 }}>{t.title}</div>
                  <div style={{ fontSize: 11.5, color: "var(--text-muted)" }}>Fällig {fmtDateShort(t.due)}</div>
                </div>
                <Badge color={p.color} bg={p.bg}>{p.label}</Badge>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ChefDashboard({ db, me, go }) {
  const todayIso = isoDay(new Date());
  const activeEmployees = db.users.filter((u) => u.role === "mitarbeiter" && u.active);
  const todaysAppts = db.appointments.filter((a) => a.date === todayIso);
  const activeProjects = db.projects.filter((p) => p.status === "in_bearbeitung");
  const openTasks = db.tasks.filter((t) => t.status !== "erledigt");
  const pendingAbsences = db.absences.filter((a) => a.status === "offen");

  return (
    <div className="mf-fade-in">
      <h1 className="mf-heading" style={{ fontSize: 24, fontWeight: 800, marginBottom: 2 }}>{greetingWord()}, {me.name.split(" ")[0]} 👋</h1>
      <p style={{ color: "var(--text-muted)", fontSize: 14.5, marginBottom: 22 }}>
        Heute sind {todaysAppts.length} Termine und {activeProjects.length} Baustellen aktiv.
      </p>

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 22 }}>
        <StatCard label="Team heute" value={activeEmployees.length} icon={Users} />
        <StatCard label="Termine heute" value={todaysAppts.length} icon={CalendarDays} accent />
        <StatCard label="Aktive Baustellen" value={activeProjects.length} icon={Building2} />
        <StatCard label="Offene Aufgaben" value={openTasks.length} icon={CheckSquare} />
        <StatCard label="Abwesenheiten" value={pendingAbsences.length} icon={ClipboardList} accent />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 18 }} className="mf-dash-grid">
        <div className="mf-card" style={{ padding: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <h3 className="mf-heading" style={{ fontSize: 16, fontWeight: 800 }}>Aktuelle Baustellen</h3>
            <span onClick={() => go("projects")} style={{ fontSize: 12.5, fontWeight: 700, color: "var(--blue-600)", cursor: "pointer" }}>Alle ansehen</span>
          </div>
          {db.projects.map((p) => (
            <div key={p.id} onClick={() => go("projectDetail", { id: p.id })} style={{ padding: "12px 0", borderBottom: "1px solid var(--border)", cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                <span style={{ fontWeight: 700, fontSize: 14 }}>{p.name}</span>
                <span style={{ fontWeight: 700, fontSize: 13, color: "var(--blue-600)" }}>{p.progress}%</span>
              </div>
              <div style={{ height: 8, borderRadius: 8, background: "var(--surface-2)", overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${p.progress}%`, background: "linear-gradient(90deg, var(--blue-600), var(--yellow-500))", borderRadius: 8 }} />
              </div>
            </div>
          ))}
        </div>
        <div className="mf-card" style={{ padding: 20 }}>
          <h3 className="mf-heading" style={{ fontSize: 16, fontWeight: 800, marginBottom: 14 }}>Team-Status</h3>
          {activeEmployees.map((u) => {
            const s = STATUS_META[u.status] || STATUS_META.verfuegbar;
            return (
              <div key={u.id} onClick={() => go("teamMemberDetail", { id: u.id })} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", cursor: "pointer" }}>
                <Avatar name={u.name} size={30} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 600 }}>{u.name}</div>
                  <div style={{ fontSize: 11.5, color: "var(--text-muted)" }}>{u.position}</div>
                </div>
                <Badge color={s.color} bg={s.bg}>{s.label}</Badge>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Appointment modal                                                       */
/* ---------------------------------------------------------------------- */

function AppointmentModal({ db, me, defaultDate, onClose, onSave }) {
  const [title, setTitle] = useState("");
  const [description, setDescription] = useState("");
  const [date, setDate] = useState(defaultDate || isoDay(new Date()));
  const [start, setStart] = useState("09:00");
  const [end, setEnd] = useState("10:00");
  const [location, setLocation] = useState("");
  const [employeeIds, setEmployeeIds] = useState(me.role === "chef" ? [] : [me.id]);
  const [customerId, setCustomerId] = useState("");
  const [projectId, setProjectId] = useState("");
  const [category, setCategory] = useState("kunde");
  const [priority, setPriority] = useState("mittel");

  function toggleEmp(id) {
    setEmployeeIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);
  }

  function submit(e) {
    e.preventDefault();
    if (!title.trim() || employeeIds.length === 0) return;
    onSave({
      id: uid("ap"), title: title.trim(), description, date, start, end, location,
      employeeIds, customerId: customerId || null, projectId: projectId || null,
      category, priority, status: "geplant",
    });
  }

  return (
    <Modal title="Neuer Termin" onClose={onClose} width={520}>
      <form onSubmit={submit}>
        <label className="mf-label">Titel</label>
        <input className="mf-input" style={{ marginBottom: 12 }} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="z. B. Kundentermin Müller GmbH" required />

        <label className="mf-label">Beschreibung</label>
        <textarea className="mf-input" style={{ marginBottom: 12, minHeight: 60, resize: "vertical" }} value={description} onChange={(e) => setDescription(e.target.value)} />

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 12 }}>
          <div><label className="mf-label">Datum</label><input type="date" className="mf-input" value={date} onChange={(e) => setDate(e.target.value)} required /></div>
          <div><label className="mf-label">Start</label><input type="time" className="mf-input" value={start} onChange={(e) => setStart(e.target.value)} required /></div>
          <div><label className="mf-label">Ende</label><input type="time" className="mf-input" value={end} onChange={(e) => setEnd(e.target.value)} required /></div>
        </div>

        <label className="mf-label">Ort</label>
        <input className="mf-input" style={{ marginBottom: 12 }} value={location} onChange={(e) => setLocation(e.target.value)} placeholder="z. B. Stuttgart" />

        {me.role === "chef" && (
          <>
            <label className="mf-label">Mitarbeiter</label>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
              {db.users.filter((u) => u.role === "mitarbeiter" && u.active).map((u) => (
                <button type="button" key={u.id} onClick={() => toggleEmp(u.id)}
                  className="mf-btn" style={{
                    padding: "6px 12px", fontSize: 12.5,
                    background: employeeIds.includes(u.id) ? "var(--blue-600)" : "var(--surface-2)",
                    color: employeeIds.includes(u.id) ? "#fff" : "var(--text)",
                  }}>{u.name}</button>
              ))}
            </div>
          </>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
          <div>
            <label className="mf-label">Kunde</label>
            <select className="mf-input" value={customerId} onChange={(e) => setCustomerId(e.target.value)}>
              <option value="">–</option>
              {db.customers.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div>
            <label className="mf-label">Baustelle</label>
            <select className="mf-input" value={projectId} onChange={(e) => setProjectId(e.target.value)}>
              <option value="">–</option>
              {db.projects.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
        </div>

function MonthGrid({ monthDate, appointmentsByDay, onDayClick, selectedIso }) {
  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
  const todayIso = isoDay(new Date());

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4, marginBottom: 6 }}>
        {["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map((d) => (
          <div key={d} style={{ textAlign: "center", fontSize: 11.5, fontWeight: 700, color: "var(--text-muted)", padding: "4px 0" }}>{d}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4 }}>
        {cells.map((d, i) => {
          if (!d) return <div key={i} />;
          const iso = isoDay(d);
          const appts = appointmentsByDay[iso] || [];
          const isToday = iso === todayIso;
          const isSelected = iso === selectedIso;
          return (
            <div key={i} onClick={() => onDayClick(iso)} style={{
              minHeight: 68, borderRadius: 10, padding: 6, cursor: "pointer",
              background: isSelected ? "var(--blue-100)" : "var(--surface)",
              border: isToday ? "1.5px solid var(--blue-600)" : "1px solid var(--border)",
            }}>
              <div style={{ fontSize: 12, fontWeight: isToday ? 800 : 600, color: isToday ? "var(--blue-600)" : "var(--text)" }}>{d.getDate()}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 2, marginTop: 4 }}>
                {appts.slice(0, 2).map((a) => {
                  const meta = CATEGORY_META[a.category] || CATEGORY_META.allgemein;
                  return <div key={a.id} style={{ fontSize: 10, fontWeight: 600, color: meta.color, background: meta.bg, borderRadius: 4, padding: "1px 4px", overflow: "hidden", whiteSpace: "nowrap", textOverflow: "ellipsis" }}>{a.title}</div>;
                })}
                {appts.length > 2 && <div style={{ fontSize: 9.5, color: "var(--text-muted)", fontWeight: 700 }}>+{appts.length - 2} weitere</div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CalendarView({ db, me, updateDB, pushNotification, showToast }) {
  const [monthDate, setMonthDate] = useState(new Date());
  const [selectedIso, setSelectedIso] = useState(isoDay(new Date()));
  const [showModal, setShowModal] = useState(false);
  const [viewMode, setViewMode] = useState("monat");

  const visible = me.role === "chef" ? db.appointments : db.appointments.filter((a) => a.employeeIds.includes(me.id));

  const byDay = useMemo(() => {
    const map = {};
    visible.forEach((a) => { (map[a.date] = map[a.date] || []).push(a); });
    Object.values(map).forEach((arr) => arr.sort((a, b) => a.start.localeCompare(b.start)));
    return map;
  }, [visible]);

  function saveAppointment(appt) {
    updateDB((prev) => {
      const next = { ...prev, appointments: [...prev.appointments, appt] };
      if (me.role === "chef") {
        appt.employeeIds.forEach((eid) => {
          if (eid !== me.id) next.notifications = [{ id: uid("n"), audience: `user:${eid}`, text: `Neuer Termin von deinem Chef: ${appt.title}`, time: Date.now(), read: false }, ...next.notifications];
        });
      }
      return next;
    });
    setShowModal(false);
    showToast("Termin wurde erstellt.");
  }

  const selectedAppts = byDay[selectedIso] || [];
  const monthLabel = monthDate.toLocaleDateString("de-DE", { month: "long", year: "numeric" });

  const dayList = useMemo(() => {
    return Object.entries(byDay).sort(([a], [b]) => a.localeCompare(b)).filter(([d]) => d >= isoDay(new Date())).slice(0, 8);
  }, [byDay]);

  return (
    <div className="mf-fade-in">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18, flexWrap: "wrap", gap: 10 }}>
        <h1 className="mf-heading" style={{ fontSize: 22, fontWeight: 800 }}>Kalender</h1>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ display: "flex", background: "var(--surface-2)", borderRadius: 10, padding: 3 }}>
            {["monat", "liste"].map((v) => (
              <button key={v} onClick={() => setViewMode(v)} className="mf-btn" style={{ padding: "6px 14px", fontSize: 12.5, background: viewMode === v ? "var(--surface)" : "transparent", boxShadow: viewMode === v ? "var(--shadow)" : "none" }}>{v[0].toUpperCase() + v.slice(1)}</button>
            ))}
          </div>
          <button className="mf-btn mf-btn-primary" onClick={() => setShowModal(true)}><Plus size={15} /> Neuer Termin</button>
        </div>
      </div>

      {viewMode === "monat" ? (
        <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr", gap: 18 }} className="mf-dash-grid">
          <div className="mf-card" style={{ padding: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <button className="mf-btn mf-btn-ghost" style={{ padding: 6 }} onClick={() => setMonthDate(new Date(monthDate.getFullYear(), monthDate.getMonth() - 1, 1))}><ChevronLeft size={16} /></button>
              <span className="mf-heading" style={{ fontWeight: 800, fontSize: 15, textTransform: "capitalize" }}>{monthLabel}</span>
              <button className="mf-btn mf-btn-ghost" style={{ padding: 6 }} onClick={() => setMonthDate(new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 1))}><ChevronRight size={16} /></button>
            </div>
            <MonthGrid monthDate={monthDate} appointmentsByDay={byDay} onDayClick={setSelectedIso} selectedIso={selectedIso} />
          </div>
          <div className="mf-card" style={{ padding: 18 }}>
            <h3 className="mf-heading" style={{ fontSize: 15, fontWeight: 800, marginBottom: 4 }}>{fmtDate(selectedIso)}</h3>
            <p style={{ fontSize: 12.5, color: "var(--text-muted)", marginBottom: 14 }}>{selectedAppts.length} Termin{selectedAppts.length !== 1 ? "e" : ""}</p>
            {selectedAppts.length === 0 ? <EmptyState icon={CalendarDays} text="Keine Termine" /> : selectedAppts.map((a) => <AppointmentRow key={a.id} a={a} db={db} />)}
          </div>
        </div>
      ) : (
        <div className="mf-card" style={{ padding: 18 }}>
          {dayList.length === 0 ? <EmptyState icon={CalendarDays} text="Keine anstehenden Termine" /> : dayList.map(([d, appts]) => (
            <div key={d} style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 12.5, fontWeight: 800, color: "var(--blue-600)", marginBottom: 8, textTransform: "capitalize" }}>
                {new Date(d).toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long" })}
              </div>
              {appts.map((a) => <AppointmentRow key={a.id} a={a} db={db} />)}
            </div>
          ))}
        </div>
      )}

      {showModal && <AppointmentModal db={db} me={me} defaultDate={selectedIso} onClose={() => setShowModal(false)} onSave={saveAppointment} />}
    </div>
  );
}

function TasksView({ db, me, updateDB, showToast }) {
  const [showModal, setShowModal] = useState(false);
  const [filterStatus, setFilterStatus] = useState("alle");
  const [justDone, setJustDone] = useState(null);

  const base = me.role === "chef" ? db.tasks : db.tasks.filter((t) => t.assigneeId === me.id);
  const filtered = filterStatus === "alle" ? base : base.filter((t) => t.status === filterStatus);
  const sorted = [...filtered].sort((a, b) => (a.status === "erledigt") - (b.status === "erledigt") || a.due.localeCompare(b.due));

  function saveTask(t) {
    updateDB((prev) => {
      const next = { ...prev, tasks: [...prev.tasks, t] };
      if (me.role === "chef" && t.assigneeId !== me.id) {
        next.notifications = [{ id: uid("n"), audience: `user:${t.assigneeId}`, text: `Neue Aufgabe: ${t.title}`, time: Date.now(), read: false }, ...next.notifications];
      }
      return next;
    });
    setShowModal(false);
    showToast("Aufgabe wurde erstellt.");
  }

  function cycleStatus(t) {
    const order = ["offen", "in_bearbeitung", "erledigt"];
    const nextStatus = order[(order.indexOf(t.status) + 1) % order.length];
    if (nextStatus === "erledigt") setJustDone(t.id);
    updateDB((prev) => ({ ...prev, tasks: prev.tasks.map((x) => x.id === t.id ? { ...x, status: nextStatus } : x) }));
  }

  return (
    <div className="mf-fade-in">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18, flexWrap: "wrap", gap: 10 }}>
        <h1 className="mf-heading" style={{ fontSize: 22, fontWeight: 800 }}>Aufgaben</h1>
        <button className="mf-btn mf-btn-primary" onClick={() => setShowModal(true)}><Plus size={15} /> Neue Aufgabe</button>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {["alle", "offen", "in_bearbeitung", "erledigt"].map((s) => (
          <button key={s} onClick={() => setFilterStatus(s)} className="mf-btn" style={{ padding: "6px 14px", fontSize: 12.5, background: filterStatus === s ? "var(--blue-600)" : "var(--surface-2)", color: filterStatus === s ? "#fff" : "var(--text)" }}>
            {s === "alle" ? "Alle" : s === "in_bearbeitung" ? "In Bearbeitung" : s[0].toUpperCase() + s.slice(1)}
          </button>
        ))}
      </div>

      <div className="mf-card" style={{ padding: 6 }}>
        {sorted.length === 0 ? <EmptyState icon={CheckSquare} text="Keine Aufgaben" /> : sorted.map((t) => {
          const p = PRIORITY_META[t.priority];
          const project = db.projects.find((pr) => pr.id === t.projectId);
          const assignee = db.users.find((u) => u.id === t.assigneeId);
          const done = t.status === "erledigt";
          return (
            <div key={t.id} className={justDone === t.id ? "mf-task-done" : ""} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderBottom: "1px solid var(--border)" }}>
              <button onClick={() => cycleStatus(t)} style={{
                width: 22, height: 22, borderRadius: 7, border: `2px solid ${done ? "var(--green-500)" : "var(--border)"}`,
                background: done ? "var(--green-500)" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0,
              }}>{done && <Check size={13} color="#fff" />}</button>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14, fontWeight: 600, textDecoration: done ? "line-through" : "none", color: done ? "var(--text-muted)" : "var(--text)" }}>{t.title}</div>
                <div style={{ fontSize: 12, color: "var(--text-muted)", display: "flex", gap: 8, flexWrap: "wrap", marginTop: 2 }}>
                  {project && <span>{project.name}</span>}
                  {me.role === "chef" && assignee && <span>· {assignee.name}</span>}
                  <span>· Fällig {fmtDateShort(t.due)}</span>
                </div>
              </div>
              {t.status === "in_bearbeitung" && !done && <Badge color="var(--blue-600)" bg="var(--blue-100)">In Bearbeitung</Badge>}
              <Badge color={p.color} bg={p.bg}>{p.label}</Badge>
            </div>
          );
        })}
      </div>

      {showModal && <TaskModal db={db} me={me} onClose={() => setShowModal(false)} onSave={saveTask} />}
    </div>
  );
}

  const [showModal, setShowModal] = useState(false);
  const list = me.role === "chef" ? db.absences : db.absences.filter((a) => a.employeeId === me.id);
  const sorted = [...list].sort((a, b) => (a.status === "offen") ? -1 : 1);

  function save(a) {
    updateDB((prev) => ({
      ...prev,
      absences: [...prev.absences, { ...a, employeeId: me.id }],
      notifications: [{ id: uid("n"), audience: "chef", text: `${me.name} hat ${ABSENCE_META[a.type].label} beantragt`, time: Date.now(), read: false }, ...prev.notifications],
    }));
    setShowModal(false);
    showToast("Abwesenheit wurde beantragt.");
  }

  function decide(id, status) {
    updateDB((prev) => {
      const abs = prev.absences.find((a) => a.id === id);
      const next = { ...prev, absences: prev.absences.map((a) => a.id === id ? { ...a, status } : a) };
      if (abs) next.notifications = [{ id: uid("n"), audience: `user:${abs.employeeId}`, text: `Dein Antrag (${ABSENCE_META[abs.type].label}) wurde ${status === "genehmigt" ? "genehmigt" : "abgelehnt"}`, time: Date.now(), read: false }, ...next.notifications];
      return next;
    });
    showToast(status === "genehmigt" ? "Antrag genehmigt." : "Antrag abgelehnt.");
  }

  return (
    <div className="mf-fade-in">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18, flexWrap: "wrap", gap: 10 }}>
        <h1 className="mf-heading" style={{ fontSize: 22, fontWeight: 800 }}>Abwesenheiten</h1>
        {me.role !== "chef" && <button className="mf-btn mf-btn-primary" onClick={() => setShowModal(true)}><Plus size={15} /> Beantragen</button>}
      </div>
      <div className="mf-card" style={{ padding: 6 }}>
        {sorted.length === 0 ? <EmptyState icon={ClipboardList} text="Keine Abwesenheiten" /> : sorted.map((a) => {
          const meta = ABSENCE_META[a.type];
          const emp = db.users.find((u) => u.id === a.employeeId);
          const statusColor = a.status === "genehmigt" ? { c: "var(--green-500)", b: "var(--green-100)" } : a.status === "abgelehnt" ? { c: "var(--red-500)", b: "var(--red-100)" } : { c: "var(--yellow-600)", b: "var(--yellow-100)" };
          return (
            <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderBottom: "1px solid var(--border)" }}>
              <div style={{ fontSize: 20 }}>{meta.icon}</div>
              <div style={{ flex: 1 }}>
                {me.role === "chef" && <div style={{ fontWeight: 700, fontSize: 13.5 }}>{emp?.name}</div>}
                <div style={{ fontSize: 13, fontWeight: 600 }}>{meta.label}</div>
                <div style={{ fontSize: 12, color: "var(--text-muted)" }}>{fmtDateShort(a.start)} – {fmtDateShort(a.end)}</div>
              </div>
              <Badge color={statusColor.c} bg={statusColor.b}>{a.status === "offen" ? "Offen" : a.status === "genehmigt" ? "Genehmigt" : "Abgelehnt"}</Badge>
              {me.role === "chef" && a.status === "offen" && (
                <div style={{ display: "flex", gap: 6 }}>
                  <button onClick={() => decide(a.id, "genehmigt")} className="mf-btn" style={{ padding: "5px 10px", fontSize: 11.5, background: "var(--green-100)", color: "var(--green-500)" }}>Genehmigen</button>
                  <button onClick={() => decide(a.id, "abgelehnt")} className="mf-btn" style={{ padding: "5px 10px", fontSize: 11.5, background: "var(--red-100)", color: "var(--red-500)" }}>Ablehnen</button>
                </div>
              )}
            </div>
          );
        })}
      </div>
      {showModal && <AbsenceModal onClose={() => setShowModal(false)} onSave={save} />}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Materials                                                               */
/* ---------------------------------------------------------------------- */

function MaterialsView({ db, updateDB, showToast }) {
  function adjust(id, delta) {
    updateDB((prev) => ({ ...prev, materials: prev.materials.map((m) => m.id === id ? { ...m, stock: Math.max(0, m.stock + delta) } : m) }));
  }
  return (
    <div className="mf-fade-in">
      <h1 className="mf-heading" style={{ fontSize: 22, fontWeight: 800, marginBottom: 18 }}>Materialübersicht</h1>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 14 }}>
        {db.materials.map((m) => {
          const low = m.stock <= m.low;
          return (
            <div key={m.id} className="mf-card" style={{ padding: 16 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                <span style={{ fontWeight: 700, fontSize: 14.5 }}>{m.name}</span>
                {low && <AlertTriangle size={16} color="var(--yellow-600)" />}
              </div>
              <div className="mf-heading" style={{ fontSize: 24, fontWeight: 800, marginBottom: 6 }}>{m.stock} <span style={{ fontSize: 13, fontWeight: 600, color: "var(--text-muted)" }}>{m.unit}</span></div>
              {low && <div style={{ fontSize: 12, color: "var(--yellow-600)", fontWeight: 600, marginBottom: 10 }}>⚠️ {m.name} wird knapp</div>}
              <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                <button onClick={() => adjust(m.id, -5)} className="mf-btn mf-btn-ghost" style={{ padding: "5px 12px", fontSize: 12.5 }}>–5</button>
                <button onClick={() => adjust(m.id, 5)} className="mf-btn mf-btn-ghost" style={{ padding: "5px 12px", fontSize: 12.5 }}>+5</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Search                                                                  */
/* ---------------------------------------------------------------------- */

function GlobalSearch({ db, me, go }) {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    function onClick(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onClick);
    return () => document.removeEventListener("mousedown", onClick);
  }, []);

  const results = useMemo(() => {
    if (!q.trim()) return [];
    const query = q.toLowerCase();
    const out = [];
    db.customers.forEach((c) => { if (c.name.toLowerCase().includes(query)) out.push({ type: "Kunde", label: c.name, action: () => go("customerDetail", { id: c.id }) }); });
    db.projects.forEach((p) => { if (p.name.toLowerCase().includes(query)) out.push({ type: "Baustelle", label: p.name, action: () => go("projectDetail", { id: p.id }) }); });
    if (me.role === "chef") db.users.forEach((u) => { if (u.role === "mitarbeiter" && u.name.toLowerCase().includes(query)) out.push({ type: "Mitarbeiter", label: u.name, action: () => go("teamMemberDetail", { id: u.id }) }); });
    db.tasks.forEach((t) => { if (t.title.toLowerCase().includes(query) && (me.role === "chef" || t.assigneeId === me.id)) out.push({ type: "Aufgabe", label: t.title, action: () => go("tasks") }); });
    db.appointments.forEach((a) => { if (a.title.toLowerCase().includes(query) && (me.role === "chef" || a.employeeIds.includes(me.id))) out.push({ type: "Termin", label: `${a.title} · ${fmtDateShort(a.date)}`, action: () => go("calendar") }); });
    return out.slice(0, 8);
  }, [q, db, me]);

  return (
    <div ref={ref} style={{ position: "relative", flex: 1, maxWidth: 380 }}>
      <div style={{ position: "relative" }}>
        <Search size={15} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "var(--text-muted)" }} />
        <input className="mf-input" style={{ paddingLeft: 34 }} placeholder="Suche nach Kunden, Terminen, Aufgaben..." value={q}
          onChange={(e) => { setQ(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} />
      </div>
      {open && q.trim() && (
        <div className="mf-card mf-fade-in" style={{ position: "absolute", top: "110%", left: 0, right: 0, padding: 6, zIndex: 60, maxHeight: 320, overflowY: "auto" }}>
          {results.length === 0 ? <div style={{ padding: 14, fontSize: 13, color: "var(--text-muted)" }}>Keine Ergebnisse für „{q}“</div> :
            results.map((r, i) => (
              <div key={i} onClick={() => { r.action(); setOpen(false); setQ(""); }} style={{ display: "flex", justifyContent: "space-between", padding: "9px 12px", borderRadius: 8, cursor: "pointer" }}
                onMouseEnter={(e) => e.currentTarget.style.background = "var(--surface-2)"} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                <span style={{ fontSize: 13.5, fontWeight: 600 }}>{r.label}</span>
                <span style={{ fontSize: 11.5, color: "var(--text-muted)" }}>{r.type}</span>
              </div>
            ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Notifications                                                           */
/* ---------------------------------------------------------------------- */

function NotificationBell({ db, me, updateDB }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function onClick(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onClick);
    return () => document.removeEventListener("mousedown", onClick);
  }, []);

  const audience = me.role === "chef" ? "chef" : `user:${me.id}`;
  const mine = db.notifications.filter((n) => n.audience === audience).sort((a, b) => b.time - a.time);
  const unread = mine.filter((n) => !n.read).length;

  function markAllRead() {
    updateDB((prev) => ({ ...prev, notifications: prev.notifications.map((n) => n.audience === audience ? { ...n, read: true } : n) }));
  }

  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button onClick={() => { setOpen((o) => !o); if (!open) markAllRead(); }} className="mf-btn mf-btn-ghost" style={{ padding: 9, position: "relative" }}>
        <Bell size={17} />
        {unread > 0 && <span style={{ position: "absolute", top: 4, right: 5, width: 8, height: 8, borderRadius: "50%", background: "var(--yellow-500)", border: "2px solid var(--surface)" }} />}
      </button>
      {open && (
        <div className="mf-card mf-fade-in" style={{ position: "absolute", right: 0, top: "115%", width: 300, padding: 8, zIndex: 60, maxHeight: 360, overflowY: "auto" }}>
          <div style={{ fontWeight: 800, fontSize: 13.5, padding: "6px 8px 10px" }}>Benachrichtigungen</div>
          {mine.length === 0 ? <div style={{ padding: 14, fontSize: 13, color: "var(--text-muted)" }}>Keine Benachrichtigungen.</div> :
            mine.slice(0, 12).map((n) => (
              <div key={n.id} style={{ padding: "9px 8px", borderBottom: "1px solid var(--border)", fontSize: 13 }}>
                🔔 {n.text}
                <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 2 }}>{new Date(n.time).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</div>
              </div>
            ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Shell (nav + layout)                                                    */
/* ---------------------------------------------------------------------- */

const EMPLOYEE_NAV = [
  { key: "dashboard", label: "Dashboard", icon: LayoutDashboard },
  { key: "calendar", label: "Kalender", icon: CalendarDays },
  { key: "tasks", label: "Aufgaben", icon: CheckSquare },
  { key: "projects", label: "Meine Projekte", icon: Building2 },
  { key: "customers", label: "Kunden", icon: Users },
  { key: "absences", label: "Abwesenheiten", icon: ClipboardList },
];
const CHEF_EXTRA_NAV = [
  { key: "team", label: "Team", icon: Users },
  { key: "teamcalendar", label: "Teamkalender", icon: CalendarDays },
  { key: "materials", label: "Material", icon: Package },
];

function Sidebar({ me, view, go, dark, setDark, onLogout }) {
  const nav = me.role === "chef" ? [EMPLOYEE_NAV[0], EMPLOYEE_NAV[1], EMPLOYEE_NAV[2], { key: "projects", label: "Baustellen & Aufträge", icon: Building2 }, ...CHEF_EXTRA_NAV, EMPLOYEE_NAV[4], EMPLOYEE_NAV[5]] : EMPLOYEE_NAV;

  return (
    <div className="mf-sidebar" style={{ width: 240, flexShrink: 0, borderRight: "1px solid var(--border)", background: "var(--surface)", display: "flex", flexDirection: "column", padding: 18, position: "sticky", top: 0, height: "100vh" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 26, padding: "0 6px" }}>
        <Logo size={32} />
        <div className="mf-heading" style={{ fontWeight: 800, fontSize: 15, lineHeight: 1.2 }}>Malerwerk<br /><span style={{ fontWeight: 600, fontSize: 11.5, color: "var(--text-muted)" }}>Arbeitsmanager</span></div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 3, flex: 1, overflowY: "auto" }} className="mf-scroll">
        {nav.map((item, i) => (
          <div key={item.key + i} className={`mf-nav-item ${view === item.key ? "active" : ""}`} onClick={() => go(item.key)}>
            <item.icon size={17} /> {item.label}
          </div>
        ))}
      </div>

      <div style={{ borderTop: "1px solid var(--border)", paddingTop: 12, display: "flex", flexDirection: "column", gap: 3 }}>
        <div className="mf-nav-item" onClick={() => setDark((d) => !d)}>{dark ? <Sun size={17} /> : <Moon size={17} />} {dark ? "Heller Modus" : "Dunkler Modus"}</div>
        <div className="mf-nav-item" onClick={onLogout}><LogOut size={17} /> Abmelden</div>
      </div>
    </div>
  );
}

function BottomNav({ me, view, go }) {
  const items = me.role === "chef"
    ? [{ key: "dashboard", icon: LayoutDashboard }, { key: "calendar", icon: CalendarDays }, { key: "projects", icon: Building2 }, { key: "tasks", icon: CheckSquare }, { key: "team", icon: Users }]
    : [{ key: "dashboard", icon: LayoutDashboard }, { key: "calendar", icon: CalendarDays }, { key: "tasks", icon: CheckSquare }, { key: "projects", icon: Building2 }, { key: "absences", icon: ClipboardList }];
  return (
    <div className="mf-bottomnav" style={{ display: "none", position: "fixed", bottom: 0, left: 0, right: 0, background: "var(--surface)", borderTop: "1px solid var(--border)", padding: "8px 10px", justifyContent: "space-around", zIndex: 50 }}>
      {items.map((it) => (
        <div key={it.key} onClick={() => go(it.key)} style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: 6, color: view === it.key ? "var(--blue-600)" : "var(--text-muted)", cursor: "pointer" }}>
          <it.icon size={20} />
        </div>
      ))}
    </div>
  );
}

function Toast({ toasts }) {
  return (
    <div style={{ position: "fixed", bottom: 20, right: 20, display: "flex", flexDirection: "column", gap: 8, zIndex: 200 }}>
      {toasts.map((t) => (
        <div key={t.id} className="mf-pop" style={{ background: "var(--blue-900)", color: "#fff", padding: "11px 18px", borderRadius: 10, fontSize: 13.5, fontWeight: 600, boxShadow: "var(--shadow)", display: "flex", alignItems: "center", gap: 8 }}>
          <Check size={15} color="var(--yellow-500)" /> {t.text}
        </div>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Root                                                                    */
/* ---------------------------------------------------------------------- */

function MalerfirmaApp() {
  const [db, setDb] = useState(null);
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("dashboard");
  const [params, setParams] = useState({});
  const [dark, setDark] = useState(false);
  const [toasts, setToasts] = useState([]);

  useEffect(() => {
    (async () => {
      const [d, s] = await Promise.all([loadDB(), loadSession()]);
      setDb(d);
      setSession(s);
      setLoading(false);
    })();

    // Live-Sync: übernimmt Änderungen von anderen Geräten automatisch,
    // sobald Firebase konfiguriert ist (siehe Storage-Shim oben im <head>).
    if (window.__mfSubscribeDB) {
      const unsubscribe = window.__mfSubscribeDB((remoteDb) => {
        setDb(remoteDb);
      });
      return () => unsubscribe && unsubscribe();
    }
  }, []);

  function updateDB(updater) {
    setDb((prev) => {
      const next = updater(prev);
      persistDB(next);
      return next;
    });
  }

  function showToast(text) {
    const id = uid("toast");
    setToasts((t) => [...t, { id, text }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }

  function go(key, p = {}) { setView(key); setParams(p); }

  function handleLogin(userId) {
    const s = { userId };
    setSession(s);
    persistSession(s);
    setView("dashboard");
  }
  function handleLogout() {
    setSession(null);
    persistSession(null);
    setView("dashboard");
  }
  function handleRegister(user) {
    updateDB((prev) => ({ ...prev, users: [...prev.users, user] }));
    handleLogin(user.id);
    showToast(`Willkommen, ${user.name.split(" ")[0]}!`);
  }

  if (loading || !db) {
    return (
      <div className="mf-root" style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
        <GlobalStyle />
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
          <Logo size={40} />
          <div style={{ fontSize: 13, color: "var(--text-muted)", fontWeight: 600 }}>Wird geladen …</div>
        </div>
      </div>
    );
  }

  const me = session ? db.users.find((u) => u.id === session.userId && u.active) : null;

  if (!me) {
    return <LoginScreen db={db} onLogin={handleLogin} onRegister={handleRegister} />;
  }

  let content;
  if (view === "dashboard") content = me.role === "chef" ? <ChefDashboard db={db} me={me} go={go} /> : <EmployeeDashboard db={db} me={me} go={go} openAppointment={() => go("calendar")} />;
  else if (view === "calendar") content = <CalendarView db={db} me={me} updateDB={updateDB} showToast={showToast} />;
  else if (view === "teamcalendar" && me.role === "chef") content = <TeamCalendarView db={db} />;
  else if (view === "tasks") content = <TasksView db={db} me={me} updateDB={updateDB} showToast={showToast} />;
  else if (view === "projects") content = <ProjectsView db={db} me={me} updateDB={updateDB} go={go} showToast={showToast} />;
  else if (view === "projectDetail") content = <ProjectDetailView db={db} me={me} projectId={params.id} updateDB={updateDB} go={go} showToast={showToast} />;
  else if (view === "team" && me.role === "chef") content = <TeamView db={db} updateDB={updateDB} go={go} showToast={showToast} />;
  else if (view === "teamMemberDetail" && me.role === "chef") content = <TeamMemberDetailView db={db} memberId={params.id} go={go} />;
  else if (view === "customers") content = <CustomersView db={db} me={me} updateDB={updateDB} go={go} showToast={showToast} />;
  else if (view === "customerDetail") content = <CustomerDetailView db={db} customerId={params.id} go={go} />;
  else if (view === "absences") content = <AbsencesView db={db} me={me} updateDB={updateDB} showToast={showToast} />;
  else if (view === "materials" && me.role === "chef") content = <MaterialsView db={db} updateDB={updateDB} showToast={showToast} />;
  else content = <EmptyState icon={AlertTriangle} text="Kein Zugriff" sub="Diese Ansicht ist für deine Rolle nicht verfügbar." />;

  return (
    <div className={`mf-root ${dark ? "dark" : ""}`} style={{ display: "flex" }}>
      <GlobalStyle />
      <style>{`@media (max-width: 860px) { .mf-dash-grid { grid-template-columns: 1fr !important; } }`}</style>
      <Sidebar me={me} view={view} go={go} dark={dark} setDark={setDark} onLogout={handleLogout} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16, padding: "14px 24px", borderBottom: "1px solid var(--border)", background: "var(--surface)", position: "sticky", top: 0, zIndex: 40 }}>
          <GlobalSearch db={db} me={me} go={go} />
          <div style={{ flex: 1 }} />
          <NotificationBell db={db} me={me} updateDB={updateDB} />
          <div style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }} onClick={() => go("team")}>
            <Avatar name={me.name} size={30} />
            <div style={{ display: "none" }} className="mf-profile-name">
              <div style={{ fontSize: 13, fontWeight: 700 }}>{me.name}</div>
            </div>
          </div>
        </div>
        <div className="mf-main" style={{ padding: 24, maxWidth: 1180 }}>
          {content}
        </div>
      </div>
      <BottomNav me={me} view={view} go={go} />
      <Toast toasts={toasts} />
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<MalerfirmaApp />);
</script>
</body>
</html>
