<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Malerwerk Stuttgart – Arbeitsmanager</title>

<!-- React, ReactDOM und lucide-react sind fest in app.bundle.js eingebaut
     (kein Laden von unpkg.com/esm.sh mehr nötig, kein Live-Babel im
     Browser mehr -> deutlich zuverlässigerer Start). -->

<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
  #mf-loading { display:flex; align-items:center; justify-content:center; min-height:100vh; font-family: sans-serif; color:#66768E; }
</style>
</head>
<body>
<div id="root"><div id="mf-loading">Wird geladen …</div></div>

<!-- Diagnose-Wachhund: zeigt einen verständlichen Fehler an, falls die App
     nach einigen Sekunden nicht gestartet ist (z.B. weil app.bundle.js
     nicht gefunden wird, weil die Seite als lokale Datei ohne Server
     geöffnet wurde, oder weil gstatic.com für Firebase blockiert wird). -->
<script>
  (function () {
    var mfErrors = [];
    // capture:true ist nötig, damit auch Lade-Fehler von <script>-Tags erfasst werden.
    window.addEventListener(
      "error",
      function (e) {
        var src = e.target && (e.target.src || e.target.href);
        if (src) {
          mfErrors.push("Skript konnte nicht geladen werden: " + src);
        } else if (e.message) {
          mfErrors.push((e.filename ? e.filename.split("/").pop() + ": " : "") + e.message);
        }
      },
      true
    );
    window.addEventListener("unhandledrejection", function (e) {
      var r = e.reason;
      var msg = (r && (r.message || (r.toString && r.toString()))) || String(r);
      mfErrors.push("Promise-Fehler: " + msg);
    });

    function probe(name, url) {
      return fetch(url, { mode: "no-cors", cache: "no-store" })
        .then(function () { return null; })
        .catch(function () { return name + " (" + url + ") ist nicht erreichbar – wird vermutlich blockiert."; });
    }

    setTimeout(function () {
      var stillLoading = document.getElementById("mf-loading");
      if (!stillLoading) return; // App hat erfolgreich gestartet

      Promise.all([
        probe("gstatic.com", "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js"),
      ]).then(function (probeResults) {
        var allMsgs = probeResults.filter(Boolean).concat(mfErrors);
        var details = allMsgs.length
          ? '<div style="margin-top:14px;text-align:left;background:#fff3f3;border:1px solid #f3b7b7;border-radius:8px;padding:10px 14px;font-size:12.5px;color:#a33;max-width:520px;white-space:pre-wrap;">' +
            allMsgs.join("\n").replace(/</g, "&lt;") +
            "</div>"
          : '<div style="margin-top:14px;font-size:12.5px;color:#a33;">Keine Netzwerkfehler erkannt – möglicherweise ein Skriptfehler in der App selbst. Bitte F12 → Konsole prüfen.</div>';
        stillLoading.outerHTML =
          '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;">' +
          '<div style="text-align:center;max-width:520px;padding:24px;">' +
          '<div style="font-size:16px;font-weight:700;color:#333;margin-bottom:8px;">Die App konnte nicht geladen werden</div>' +
          '<div style="font-size:13.5px;color:#66768E;line-height:1.6;">Häufigster Grund: Die Datei wurde direkt per Doppelklick geöffnet (Adresse beginnt mit <b>file://</b>). Browser blockieren dann aus Sicherheitsgründen das Nachladen von <b>app.bundle.js</b>. Öffne die Seite stattdessen über einen lokalen Server oder ein echtes Hosting (http:// bzw. https://). Alternativ kann ein Werbe-/Skriptblocker oder das Netzwerk den Zugriff auf <b>gstatic.com</b> (Firebase) verhindern.</div>' +
          details +
          '<button onclick="location.reload()" style="margin-top:16px;padding:9px 18px;border-radius:8px;border:none;background:#1c3a5e;color:#fff;font-weight:700;cursor:pointer;">Neu laden</button>' +
          "</div></div>";
      });
    }, 9000);
  })();
</script>

<script type="module">
  /* ======================================================================
     FIREBASE-KONFIGURATION
     ----------------------------------------------------------------------
     Trage hier die Konfigurationswerte deines eigenen Firebase-Projekts
     ein. Du findest sie in der Firebase-Console unter:
     Projekteinstellungen -> "Meine Apps" -> Web-App -> SDK-Konfiguration.

     Kurzanleitung:
     1. https://console.firebase.google.com öffnen, neues Projekt anlegen
        (kostenloser "Spark"-Plan reicht).
     2. Im Projekt: "Firestore Database" -> "Datenbank erstellen"
        -> Testmodus wählen (oder Regeln s.u. verwenden).
     3. Unter "Projektübersicht" -> Zahnrad -> "Projekteinstellungen"
        -> "Meine Apps" -> "</> Web" -> App registrieren.
     4. Die angezeigten Werte unten eintragen.

     Sicherheitsregeln (Firestore -> Regeln), da diese App ohne Login-
     Prüfung auf Firebase-Ebene arbeitet (die App-eigene Anmeldung bleibt
     wie gehabt bestehen, sichert aber nicht die Datenbank selbst ab):

       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /malerfirma_shared/{docId} {
             allow read, write: if true; // Testmodus – siehe Hinweis unten
           }
         }
       }

     Hinweis: "allow read, write: if true" macht die Daten für jeden mit
     der Projekt-URL lesbar/schreibbar. Für eine echte Firmen-App sollte
     hier eine Firebase-Authentifizierung ergänzt und die Regel auf
     angemeldete Nutzer eingeschränkt werden (allow read, write: if
     request.auth != null). Für eine einfache interne Team-Lösung reicht
     der Testmodus oft aus, solange die URL nicht öffentlich geteilt wird.
     ====================================================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyAUOLTCYtr7fQc4kP3j-t6lsgAK4BIEgw8",
    authDomain: "hs-planer-104d7.firebaseapp.com",
    projectId: "hs-planer-104d7",
    storageBucket: "hs-planer-104d7.firebasestorage.app",
    messagingSenderId: "921699904238",
    appId: "1:921699904238:web:a05c701a4b6e1c3d7fe1ff",
    measurementId: "G-XDHZE35MPB",
  };

  const FIREBASE_CONFIGURED = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("DEIN_");

  function fullKeyPrivate(key) {
    return "malerfirma_private_" + key;
  }

  if (!FIREBASE_CONFIGURED) {
    // Kein Firebase eingerichtet -> Fallback auf localStorage (nur dieses Gerät).
    console.warn("Firebase ist nicht konfiguriert – Daten werden nur lokal in diesem Browser gespeichert. Siehe Kommentar im <head> der Datei.");
    installLocalStorageFallback();
  } else {
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
      const { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot } =
        await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js");

      const fbApp = initializeApp(firebaseConfig);
      const fs = getFirestore(fbApp);
      const COLLECTION = "malerfirma_shared";

      window.storage = {
        async get(key, shared) {
          if (!shared) {
            const raw = localStorage.getItem(fullKeyPrivate(key));
            return raw === null ? null : { key, value: raw, shared: false };
          }
          const snap = await getDoc(doc(fs, COLLECTION, key));
          if (!snap.exists()) return null;
          return { key, value: snap.data().value, shared: true };
        },
        async set(key, value, shared) {
          if (!shared) {
            localStorage.setItem(fullKeyPrivate(key), value);
            return { key, value, shared: false };
          }
          await setDoc(doc(fs, COLLECTION, key), { value, updatedAt: Date.now() });
          return { key, value, shared: true };
        },
        async delete(key, shared) {
          if (!shared) {
            localStorage.removeItem(fullKeyPrivate(key));
            return { key, deleted: true, shared: false };
          }
          await deleteDoc(doc(fs, COLLECTION, key));
          return { key, deleted: true, shared: true };
        },
        async list() { return { keys: [] }; },
      };

      // Live-Sync: liefert Änderungen von anderen Geräten in Echtzeit.
      window.__mfSubscribeDB = function (callback) {
        return onSnapshot(doc(fs, COLLECTION, "db"), (snap) => {
          if (snap.exists()) {
            try { callback(JSON.parse(snap.data().value)); } catch (e) {}
          }
        });
      };
    } catch (err) {
      // Firebase konnte nicht geladen/initialisiert werden (z.B. Netzwerk,
      // Blocker, falsche Config) -> App bleibt trotzdem nutzbar, nur ohne
      // geräteübergreifende Synchronisierung.
      console.error("Firebase konnte nicht geladen werden, verwende lokalen Speicher als Fallback:", err);
      installLocalStorageFallback();
    }
  }

  function installLocalStorageFallback() {
    window.storage = {
      async get(key, shared) {
        const raw = localStorage.getItem("malerfirma_" + (shared ? "shared_" : "private_") + key);
        if (raw === null) return null;
        return { key, value: raw, shared: !!shared };
      },
      async set(key, value, shared) {
        localStorage.setItem("malerfirma_" + (shared ? "shared_" : "private_") + key, value);
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        localStorage.removeItem("malerfirma_" + (shared ? "shared_" : "private_") + key);
        return { key, deleted: true, shared: !!shared };
      },
      async list() { return { keys: [] }; },
    };
  }
</script>

<!-- App-Code (React, ReactDOM, lucide-react und dein UI-Code) als eine
     lokale, vorkompilierte Datei -- kein CDN, kein Live-Babel im Browser. -->
<script src="app.bundle.js" defer></script>
</body>
</html>
